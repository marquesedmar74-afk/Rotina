<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
*{box-sizing:border-box;font-family:-apple-system,Helvetica,sans-serif}
body{margin:0;background:#f2f4f8;color:#222;padding-bottom:70px}
header{background:#3b6fd4;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;margin:0}
.coins{background:#ffd54a;color:#5a4300;border-radius:20px;padding:6px 12px;font-weight:700}
main{padding:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:28px;height:28px}
.task .info{flex:1}
.task small{color:#777}
.done .name{text-decoration:line-through;color:#999}
button{background:#3b6fd4;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px}
button.red{background:#d43b3b}
input,select{width:100%;padding:10px;margin:4px 0 10px;border:1px solid #ccd;border-radius:8px;font-size:16px}
.task input[type=checkbox]{width:28px;height:28px;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd}
nav button{flex:1;background:none;color:#3b6fd4;border-radius:0;padding:16px 4px}
nav button.active{font-weight:700;background:#e8efff}
.bar{height:14px;background:#e3e7ee;border-radius:8px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:#3bb273}
.late{color:#d43b3b;font-weight:700}
body.kid{background:linear-gradient(180deg,#7ec8ff 0%,#c9e9ff 45%,#fff3c4 100%);min-height:100vh}
body.kid header{background:linear-gradient(90deg,#ff7a59,#ffb347);border-radius:0 0 24px 24px;box-shadow:0 4px 10px #0002}
body.kid .card{border-radius:22px;box-shadow:0 4px 12px #0002;border:3px solid #fff}
body.kid nav{border-radius:22px 22px 0 0;box-shadow:0 -3px 10px #0002}
body.kid nav button{font-size:13px}
body.kid .task{border-bottom:2px dashed #e7e7e7}
body.kid .task input[type=checkbox]{width:34px;height:34px;accent-color:#3bb273}
.ico{font-size:34px;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.saud{text-align:center;padding:6px 0 14px}
.saud .bicho{font-size:64px;display:inline-block;animation:pula 2s ease-in-out infinite}
.saud h2{margin:4px 0;font-size:24px;color:#14507a}
.saud p{margin:0;color:#14507a;font-weight:700}
@keyframes pula{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.conf{position:fixed;top:-20px;font-size:24px;z-index:99;pointer-events:none;animation:cai 2.2s linear forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
.humor{display:flex;justify-content:space-between;gap:6px;margin:10px 4px 0}
.humor button{flex:1;background:#ffffffcc;border:3px solid transparent;border-radius:18px;padding:6px 0;font-size:34px;line-height:1.1;box-shadow:0 2px 6px #0002}
.humor button.sel{border-color:#14507a;background:#fff;transform:scale(1.12);box-shadow:0 4px 10px #0003}
.humor-t{margin:12px 4px 0;font-weight:700;color:#14507a;font-size:15px;text-align:left}
.moeda-pula{animation:moeda .6s ease}
@keyframes moeda{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(-8deg)}100%{transform:scale(1)}}
label{display:block;font-size:13px;color:#555;margin-top:6px}
</style>
</head>
<body>

<main id="main"></main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

const app=initializeApp({
  apiKey:"AIzaSyAY5Qd6odxo-SUmFDRiwoYNqFdGUZLF250",
  authDomain:"rotina-joao.firebaseapp.com",
  projectId:"rotina-joao",
  storageBucket:"rotina-joao.firebasestorage.app",
  messagingSenderId:"604511598547",

const auth=getAuth(app), db=getFirestore(app), ref=doc(db,'rotina','estado');

const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoje=()=>fmt(new Date());
const padrao={
  modo:'tarde', moedas:0,
  premios:[{nome:'Sorvete',custo:30},{nome:'1h de videogame',custo:50}],
  tarefas:[
    {id:1,nome:'Acordar',tipo:'alarme',hora:'12:00',modo:'tarde',meta:5,moedas:2,grupo:'manha'},
    {id:2,nome:'Arrumar a cama',tipo:'checklist',modo:'todos',meta:5,moedas:1,grupo:'manha'},
    {id:3,nome:'Preparar o cafe',tipo:'checklist',modo:'todos',meta:4,moedas:2,grupo:'manha'},
    {id:4,nome:'Remedio da manha',tipo:'checklist',modo:'todos',meta:7,moedas:3,grupo:'manha'},
    {id:5,nome:'Fazer a licao',tipo:'checklist',modo:'todos',meta:5,moedas:3,grupo:'noite'},
    {id:6,nome:'Remedio da noite',tipo:'checklist',modo:'todos',meta:7,moedas:3,grupo:'noite'},
    {id:7,nome:'Dormir',tipo:'alarme',hora:'21:30',modo:'todos',meta:6,moedas:2,grupo:'noite'}
  ],
  historico:{}
};

let S=null, user=null, aba='hoje', erro='', antes=null, antesR=null, parar=null;
const ADMINS=['KJtN8ctEsRhVvMpVUH6kxrtf0eL2','f9IqZ5SDuKOrbPkD8RxONJhglQn2'];
const admin=()=>!!(user&&ADMINS.includes(user.uid));
const dia=d=>(S.historico[d]=S.historico[d]||{});
const periodo=t=>{const h=parseInt((t.hora||'08:00').split(':')[0],10);return h<12?'manha':h<18?'tarde':'noite'};
const NOMEP={manha:'Manha',tarde:'Tarde',noite:'Noite'};
const HORAPADRAO={2:'07:00',3:'07:30',4:'08:00',5:'19:00',6:'20:30'};
const porHora=(a,b)=>(a.hora||'').localeCompare(b.hora||'');
const NOMEDIA=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
const diasDe=t=>(t.dias&&t.dias.length)?t.dias:[0,1,2,3,4,5,6];
const valeNoDia=(t,d)=>diasDe(t).includes(d.getDay());
const valeHoje=t=>valeNoDia(t,new Date());
const doModo=()=>S.tarefas.filter(t=>t.modo==='todos'||t.modo===S.modo);
const ativas=()=>doModo().filter(valeHoje);
const textoDias=t=>{const d=diasDe(t);if(d.length===7)return 'todos os dias';return [1,2,3,4,5,6,0].filter(x=>d.includes(x)).map(x=>NOMEDIA[x]).join(', ')};
const metaSemana=t=>diasDe(t).length;

async function salvar(...campos){
  const d={};campos.forEach(c=>d[c]=S[c]);
  try{await updateDoc(ref,d)}catch(e){alert('Nao consegui salvar: '+e.message)}
}
async function gravar(d){
  try{await updateDoc(ref,d)}catch(e){alert('Nao consegui salvar: '+e.message)}
}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const numOk=(v,min,max)=>{const n=Math.round(+v);return isFinite(n)&&n>=min&&n<=max?n:null};
const horaOk=h=>/^([01]\d|2[0-3]):[0-5]\d$/.test(h||'');
function aviso(msg){
  let e=document.getElementById('toast');
  if(!e){e=document.createElement('div');e.id='toast';
    e.style.cssText='position:fixed;top:12px;left:12px;right:12px;background:#3bb273;color:#fff;padding:14px;border-radius:12px;z-index:9;font-weight:700;display:none';
    document.body.appendChild(e)}
  e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',5000);
}
function checarAvisos(novo){
  const h=novo.historico[hoje()]||{};
  const snap={};Object.keys(h).forEach(k=>{if(k!==HUMOR_KEY)snap[k]=estado(h[k])});
  if(antes===null){antes=snap;return}
  if(admin()){
    Object.keys(snap).filter(id=>!antes[id]).forEach(id=>{
      const t=novo.tarefas.find(x=>String(x.id)===id);
      if(t)aviso((snap[id]==='pendente'?'Aguardando aprovacao: ':'Concluiu: ')+t.nome);
    });
  }
  antes=snap;
  const nr=(novo.resgates||[]).length;
  if(antesR!==null&&nr>antesR&&admin()){const u=novo.resgates[nr-1];aviso('Resgatou: '+u.nome)}
  antesR=nr;
}

const FIGS=['🚀','🐉','🦈','⚡','🪐','🏎️','🦖','🏀','⚽','🦅','🦁','🐺','🌋','🏔️','🥇','🛡️','⚔️','🏹','🧙','🤖','👾','🎮','🚁','✈️','🛸','🌌','☄️','🔭','🦊','🐯','🦍','🐙','🦎','🐊','🦂','🦇','🏄','⛷️','🧗','🎯','🏏','🏓','🥊','🎸','🧨','💎','🧭','🏴‍☠️','🥝','🌪️'];
const NIVEIS={bronze:{nome:'Bronze',cor:'#cd7f32'},prata:{nome:'Prata',cor:'#9aa5b1'},ouro:{nome:'Ouro',cor:'#e6b800'}};
const cfgSemana=()=>Object.assign({bronze:90,prata:95,ouro:100,bBronze:5,bPrata:8,bOuro:12},S.cfgSemana||{});
function segundaDe(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function percentualSemana(seg){
  let esp=0,feito=0;
  for(let i=0;i<7;i++){
    const d=new Date(seg);d.setDate(seg.getDate()+i);
    const h=S.historico[fmt(d)]||{};
    doModo().filter(t=>valeNoDia(t,d)).forEach(t=>{
      esp++;
      const e=estado(h[t.id]);
      if(e==='feita'||e==='aprovada')feito++;
    });
  }
  return esp?Math.round(feito/esp*100):null;
}
function nivelDe(p){
  const c=cfgSemana();
  if(p>=c.ouro)return 'ouro';
  if(p>=c.prata)return 'prata';
  if(p>=c.bronze)return 'bronze';
  return null;
}
async function fecharSemanas(){
  if(!admin()||!S)return;
  S.conquistas=S.conquistas||[];
  S.semanasFechadas=S.semanasFechadas||[];
  const atual=segundaDaSemana();
  let mudou=false;const novas=[],fechadas=[];let somaBonus=0;
  for(let k=1;k<=8;k++){
    const seg=new Date(atual);seg.setDate(atual.getDate()-7*k);
    const chave=fmt(seg);
    if(S.semanasFechadas.includes(chave))continue;
    const p=percentualSemana(seg);
    S.semanasFechadas.push(chave);fechadas.push(chave);mudou=true;
    if(p===null)continue;
    const n=nivelDe(p);
    if(!n)continue;
    const c=cfgSemana();
    const bonus={bronze:c.bBronze,prata:c.bPrata,ouro:c.bOuro}[n];
    const usadas=S.conquistas.map(x=>x.fig);
    let livres=FIGS.filter(f=>!usadas.includes(f));
    if(!livres.length)livres=FIGS.slice();
    const fig=livres[Math.floor(Math.random()*livres.length)];
    const conq={semana:chave,pct:p,nivel:n,bonus:bonus,fig:fig};
    S.conquistas.push(conq);
    novas.push(conq);
    S.moedas+=bonus;somaBonus+=bonus;
  }
  if(mudou){
    try{
      await runTransaction(db,async tx=>{
        const sn=await tx.get(ref);
        const d=sn.data()||{};
        const jaFechadas=d.semanasFechadas||[];
        const fechar=fechadas.filter(x=>!jaFechadas.includes(x));
        if(!fechar.length)return;
        const conqNovas=novas.filter(x=>fechar.includes(x.semana));
        const bonusReal=conqNovas.reduce((a,x)=>a+x.bonus,0);
        const upd={semanasFechadas:jaFechadas.concat(fechar)};
        if(conqNovas.length)upd.conquistas=(d.conquistas||[]).concat(conqNovas);
        if(bonusReal)upd.moedas=(d.moedas||0)+bonusReal;
        tx.update(ref,upd);
      });
    }catch(e){alert('Nao consegui fechar a semana: '+e.message)}
  }
}
function telaTrofeus(){
  const l=(S.conquistas||[]).slice().reverse();
  let html='<div class="card"><b>Meus trofeus ('+l.length+')</b><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">';
  html+=l.length?l.map(x=>'<div style="width:30%;min-width:90px;text-align:center;border:4px solid '+NIVEIS[x.nivel].cor+';border-radius:14px;padding:8px 4px;background:#fffdf5"><div style="font-size:40px">'+x.fig+'</div><div style="font-size:12px;font-weight:700;color:'+NIVEIS[x.nivel].cor+'">'+NIVEIS[x.nivel].nome+' '+x.pct+'%</div><div style="font-size:11px;color:#777">Semana de '+x.semana.slice(8)+'/'+x.semana.slice(5,7)+'</div><div style="font-size:11px;color:#b8860b">+'+x.bonus+' moedas</div></div>').join(''):'<div style="color:#777">Cumpra mais de '+cfgSemana().bronze+'% das metas em uma semana para ganhar seu primeiro trofeu!</div>';
  html+='</div></div>';
  const falta=[];
  html+='<div class="card"><b>Como ganhar</b><div style="margin-top:8px">Bronze: '+cfgSemana().bronze+'% ou mais (+'+cfgSemana().bBronze+' moedas)<br>Prata: '+cfgSemana().prata+'% ou mais (+'+cfgSemana().bPrata+' moedas)<br>Ouro: '+cfgSemana().ouro+'% (+'+cfgSemana().bOuro+' moedas)</div><small style="color:#777">Colecao: '+new Set((S.conquistas||[]).map(x=>x.fig)).size+' de '+FIGS.length+' figurinhas</small></div>';
  return html;
}
function mudarCfg(campo,v){
  S.cfgSemana=Object.assign({},S.cfgSemana||{});
  S.cfgSemana[campo]=Math.max(0,+v||0);
  salvar('cfgSemana');desenhar();
}
const ICONES=[[/cama|lencol|edredom/,'🛏️'],[/cafe|café|desjejum|lanche|comer|almo|jantar|refei/,'🥞'],[/remedio|remédio|medic|vitamina|pilula|comprimido/,'💊'],[/licao|lição|dever|estudar|tarefa de casa|escola|leitura|ler|livro/,'📚'],[/dente|escov/,'🪥'],[/banho|chuveiro/,'🚿'],[/acordar|despert/,'⏰'],[/dormir|sono|deitar/,'😴'],[/lixo/,'🗑️'],[/louca|louça|prato|mesa/,'🍽️'],[/roupa|uniforme|vestir|guardar/,'👕'],[/mochila|material/,'🎒'],[/quarto|arrum|limp|organiz/,'🧹'],[/cachorro|gato|pet|animal|ração|racao/,'🐶'],[/exerc|esporte|treino|futebol|bola/,'⚽'],[/violao|violão|musica|música|piano|guitarra/,'🎸'],[/agua|água|beber/,'💧'],[/tela|celular|tablet|jogo|video/,'🎮']];
const semAcento=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function iconeDe(nome){const n=semAcento(nome||'');for(const [re,ic] of ICONES){if(re.test(n))return ic}return '⭐'}
const COR_PER={manha:'#ffe28a',tarde:'#ffc58a',noite:'#b9c4ff'};
const BICHOS=['🦁','🐯','🦊','🐼','🐨','🦄','🐲','🦅'];
function saudacao(){
  const h=new Date().getHours();
  const bicho=BICHOS[new Date().getDay()%BICHOS.length];
  const s=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const at=ativas();
  const feitas=at.filter(t=>['feita','aprovada','pendente'].includes(estado(dia(hoje())[t.id]))).length;
  const tot=at.length;
  const pct=tot?Math.round(feitas/tot*100):0;
  let msg=tot===0?'Hoje nao tem tarefas. Aproveite!':feitas===0?'Vamos comecar? Voce consegue!':feitas<tot?'Muito bem! Falta pouco!':'Missao cumprida! Voce e demais!';
  return '<div class="saud"><div class="bicho">'+bicho+'</div><h2>'+s+', Joao!</h2><p>'+msg+'</p><div style="margin:10px 12px 0;text-align:left;font-size:13px;color:#14507a;font-weight:700">'+feitas+' de '+tot+' tarefas</div><div class="bar" style="margin:4px 12px 0;height:20px;background:#ffffffaa"><div style="width:'+pct+'%;background:linear-gradient(90deg,#3bb273,#9be15d);height:100%"></div></div>'+blocoHumor()+'</div>';
}
let confeteAte=0;
function confete(){
  const em=['🎉','⭐','🪙','✨','🎈','🎊'];
  if(Date.now()<confeteAte)return;
  confeteAte=Date.now()+2500;
  for(let i=0;i<24;i++){
    const e=document.createElement('div');e.className='conf';
    e.textContent=em[i%em.length];
    e.style.left=Math.random()*95+'vw';
    e.style.animationDelay=Math.random()*0.5+'s';
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),3200);
  }
  const c=document.getElementById('coins');
  if(c){c.classList.remove('moeda-pula');void c.offsetWidth;c.classList.add('moeda-pula')}
}
const HUMORES=[{e:'😄',n:'Muito feliz'},{e:'🙂',n:'Bem'},{e:'😐',n:'Mais ou menos'},{e:'😠',n:'Chateado'},{e:'🤬',n:'Com muita raiva'}];
const HUMOR_KEY='_humor';
function humorDe(data){const h=S.historico[data]||{};const v=h[HUMOR_KEY];return typeof v==='number'?v:null}
function escolherHumor(i){
  if(admin())return;
  const h=dia(hoje());
  h[HUMOR_KEY]=i;
  gravar({['historico.'+hoje()+'.'+HUMOR_KEY]:i});desenhar();
}
function blocoHumor(){
  const at=humorDe(hoje());
  return '<div class="humor-t">Como voce esta hoje?</div><div class="humor">'+HUMORES.map((x,i)=>'<button class="'+(at===i?'sel':'')+'" onclick="escolherHumor('+i+')" aria-label="'+x.n+'">'+x.e+'</button>').join('')+'</div>'+(at!==null?'<div style="text-align:center;margin-top:6px;font-size:13px;color:#14507a">Hoje: '+HUMORES[at].n+'</div>':'');
}
function cartaoHumor(){
  let linhas='';
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=fmt(d),hm=humorDe(ds);
    linhas+='<div style="flex:1;text-align:center;font-size:12px"><div style="font-size:26px;min-height:34px">'+(hm===null?'<span style="color:#bbb">-</span>':HUMORES[hm].e)+'</div>'+NOMEDIA[d.getDay()]+'</div>';
  }
  const hj=humorDe(hoje());
  return '<div class="card"><b>Como o Joao esta se sentindo</b><div style="margin-top:6px;font-size:14px">Hoje: '+(hj===null?'ainda nao respondeu':HUMORES[hj].e+' '+HUMORES[hj].n)+'</div><div style="display:flex;margin-top:10px">'+linhas+'</div><small style="color:#777">Ultimos 7 dias, a ultima coluna e hoje.</small></div>';
}
const exigeAprov=()=>S.exigirAprovacao!==false;
const hora=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function estado(v){return v===undefined||v===null||typeof v==='number'?'':(typeof v==='string'?'feita':v.s)}
function marcar(id){
  if(admin())return;
  const h=dia(hoje()), t=S.tarefas.find(x=>x.id===id);
  const e=estado(h[id]);
  if(e==='rejeitada'||e==='aprovada')return;
  const cam='historico.'+hoje()+'.'+id;
  if(e==='pendente'){delete h[id];gravar({[cam]:deleteField()});desenhar();return}
  if(e==='feita'){delete h[id];S.moedas-=t.moedas;gravar({[cam]:deleteField(),moedas:increment(-t.moedas)});desenhar();return}
  if(exigeAprov()){h[id]={s:'pendente',h:hora()};gravar({[cam]:h[id]})}
  else{h[id]=hora();S.moedas+=t.moedas;gravar({[cam]:h[id],moedas:increment(t.moedas)})}
  desenhar();confete();
}
function aprovar(data,id){
  const h=S.historico[data]||{},t=S.tarefas.find(x=>x.id===id);
  if(!t||estado(h[id])!=='pendente')return;
  h[id]={s:'aprovada',h:h[id].h};S.moedas+=t.moedas;
  gravar({['historico.'+data+'.'+id]:h[id],moedas:increment(t.moedas)});desenhar();
}
function rejeitar(data,id){
  const h=S.historico[data]||{};
  if(estado(h[id])!=='pendente')return;
  if(!confirm('Rejeitar? O Joao nao podera marcar de novo neste dia.'))return;
  h[id]={s:'rejeitada',h:h[id].h};

function mudarAprovacao(v){
  S.exigirAprovacao=v;
  const upd={exigirAprovacao:v};
  if(!v){
    let soma=0;
    Object.keys(S.historico).forEach(data=>{
      const h=S.historico[data];
      Object.keys(h).forEach(id=>{
        if(id!==HUMOR_KEY&&estado(h[id])==='pendente'){
          const t=S.tarefas.find(x=>String(x.id)===id);
          h[id]={s:'aprovada',h:h[id].h};
          upd['historico.'+data+'.'+id]=h[id];
          if(t){S.moedas+=t.moedas;soma+=t.moedas}
        }
      });
    });
    if(soma)upd.moedas=increment(soma);
  }
  gravar(upd);
  desenhar();
}
function pendentesAprov(){
  const l=[];
  Object.keys(S.historico).sort().forEach(data=>{
    const h=S.historico[data];
    Object.keys(h).forEach(id=>{

        const t=S.tarefas.find(x=>String(x.id)===id);
        if(t)l.push({data:data,t:t,h:h[id].h});
      }
    });

  return l;
}
function segundaDaSemana(){
  const d=new Date();d.setHours(12,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return d;
}
function semanaFeita(id){
  let n=0;const s=segundaDaSemana();
  for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);
    const e=estado((S.historico[fmt(d)]||{})[id]);if(e==='feita'||e==='aprovada')n++}
  return n;
}
function atrasada(t){
  if(t.tipo!=='alarme'||dia(hoje())[t.id])return false;
  const a=new Date(),p=t.hora.split(':');
  return a.getHours()*60+a.getMinutes()>(+p[0])*60+(+p[1])+15;
}
function grafico7(){
  const at=ativas();let cols='';
  const s=segundaDaSemana(),hojeStr=hoje(),nomes=['Seg','Ter','Qua','Qui','Sex','Sab','Dom'];
  for(let i=0;i<7;i++){
    const d=new Date(s);d.setDate(s.getDate()+i);
    const ds=fmt(d),futuro=ds>hojeStr,ehHoje=ds===hojeStr;
    const hh=S.historico[ds]||{};
    const atd=doModo().filter(t=>valeNoDia(t,d));
    const n=atd.filter(t=>['feita','aprovada'].includes(estado(hh[t.id]))).length;
    const p=atd.length?Math.round(n/atd.length*100):0;
    cols+='<div style="flex:1;text-align:center;font-size:12px;'+(ehHoje?'font-weight:700;background:#e8efff;border-radius:8px;':'')+'"><div style="height:100px;display:flex;align-items:flex-end"><div style="width:70%;margin:0 auto;background:#3bb273;height:'+(futuro?0:p)+'%"></div></div>'+nomes[i]+'<br>'+(futuro?'-':p+'%')+'</div>';
  }
  return '<div class="card"><b>Esta semana (segunda a domingo)</b><div style="display:flex;margin-top:10px">'+cols+'</div></div>';
}

function aplicarPenalidade(i){
  const p=(S.penalidades||[])[i];if(!p)return;
  if(!confirm('Descontar '+p.valor+' moedas por: '+p.nome+'?'))return;
  const antesSaldo=S.moedas;

  if(!S.saldoNegativo&&novo<0)novo=0;
  const tirou=antesSaldo-novo;
  S.moedas=novo;
  S.descontos=S.descontos||[];
  const desc={id:Date.now(),motivo:p.nome,valor:tirou,data:hoje()};
  S.descontos.push(desc);
  gravar({moedas:increment(-tirou),descontos:arrayUnion(desc)});desenhar();

  const t=document.getElementById('title'),c=document.getElementById('coins'),m=document.getElementById('main'),n=document.getElementById('nav');
  if(!user||!S){
    document.body.classList.remove('kid');

  }
  document.body.classList.toggle('kid',!admin());
  t.textContent=admin()?'Administrador':'🚀 Minha rotina';
  c.textContent=(admin()?'':'🪙 ')+S.moedas+' moedas';
  const telas={hoje:telaHoje,progresso:telaProgresso,premios:telaPremios,resumo:telaResumo,resgates:telaResgates,descontos:telaDescontos,trofeus:telaTrofeus,admin:telaAdmin};
  if(!telas[aba]||((aba==='resumo'||aba==='resgates'||aba==='admin')&&!admin()))aba='hoje';
  m.innerHTML=telas[aba]();
  const abas=admin()?[['hoje','Hoje'],['progresso','Metas'],['trofeus','Trofeus'],['premios','Premios']]:[['hoje','📝 Hoje'],['progresso','📊 Metas'],['trofeus','🏆 Trofeus'],['premios','🎁 Premios']];
  if(!admin())abas.push(['descontos','📉 Descontos']);
  if(admin()){const np=(S.resgates||[]).filter(r=>!r.entregue).length+pendentesAprov().length;abas.push(['resumo','Resumo'],['resgates','Aprovar'+(np?' ('+np+')':'')],['admin','Config'])}
  n.innerHTML=abas.map(a=>'<button class="'+(aba===a[0]?'active':'')+'" onclick="ir(\''+a[0]+'\')">'+a[1]+'</button>').join('')+'<button onclick="sair()">Sair</button>';
}

onAuthStateChanged(auth,async u=>{
  user=u;S=null;antes=null;antesR=null;
  if(parar){parar();parar=null}
  desenhar();
  if(!u)return;
  try{
    const s=await getDoc(ref);
    if(!s.exists()){
      try{await setDoc(ref,padrao)}
      catch(e){erro='Peca a um administrador para entrar primeiro.';await signOut(auth);return}
    }
    parar=onSnapshot(ref,sn=>{
      if(!sn.exists())return;
      S=sn.data();
      let mig=false;
      S.tarefas.forEach(t=>{if(!t.hora){t.hora=HORAPADRAO[t.id]||'08:00';mig=true}});
      if(mig&&admin())salvar('tarefas');
      checarAvisos(S);
      if(admin()&&!window.fechando){window.fechando=true;fecharSemanas().finally(()=>{window.fechando=false})}
      const digitando=aba==='admin'&&document.activeElement&&document.activeElement.tagName==='INPUT';
      if(!digitando)desenhar();
    },e=>{erro=e.message;desenhar()});
  }catch(e){erro='Erro: '+e.message;desenhar()}
