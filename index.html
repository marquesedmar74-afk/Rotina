<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotina">
<title>Rotina</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,Helvetica,sans-serif}
body{margin:0;background:#f2f4f8;color:#222;padding-bottom:70px}
header{background:#3b6fd4;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;margin:0}
.coins{background:#ffd54a;color:#5a4300;border-radius:20px;padding:6px 12px;font-weight:700}
main{padding:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:28px;height:28px}
.task .info{flex:1}
.task small{color:#777}
.done .name{text-decoration:line-through;color:#999}
button{background:#3b6fd4;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px}
button.red{background:#d43b3b}
input,select{width:100%;padding:10px;margin:4px 0 10px;border:1px solid #ccd;border-radius:8px;font-size:16px}
.task input[type=checkbox]{width:28px;height:28px;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd}
nav button{flex:1;background:none;color:#3b6fd4;border-radius:0;padding:16px 4px}
nav button.active{font-weight:700;background:#e8efff}
.bar{height:14px;background:#e3e7ee;border-radius:8px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:#3bb273}
.late{color:#d43b3b;font-weight:700}
</style>
</head>
<body>
<header><h1 id="title">Rotina</h1><div class="coins" id="coins"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyAY5Qd6odxo-SUmFDRiwoYNqFdGUZLF250",
  authDomain:"rotina-joao.firebaseapp.com",
  projectId:"rotina-joao",
  storageBucket:"rotina-joao.firebasestorage.app",
  messagingSenderId:"604511598547",
  appId:"1:604511598547:web:bb1d637e1159eb02822126"
});
const auth=getAuth(app), db=getFirestore(app), ref=doc(db,'rotina','estado');

const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoje=()=>fmt(new Date());
const padrao={
  modo:'tarde', moedas:0,
  premios:[{nome:'Sorvete',custo:30},{nome:'1h de videogame',custo:50}],
  tarefas:[
    {id:1,nome:'Acordar',tipo:'alarme',hora:'12:00',modo:'tarde',meta:5,moedas:2,grupo:'manha'},
    {id:2,nome:'Arrumar a cama',tipo:'checklist',modo:'todos',meta:5,moedas:1,grupo:'manha'},
    {id:3,nome:'Preparar o cafe',tipo:'checklist',modo:'todos',meta:4,moedas:2,grupo:'manha'},
    {id:4,nome:'Remedio da manha',tipo:'checklist',modo:'todos',meta:7,moedas:3,grupo:'manha'},
    {id:5,nome:'Fazer a licao',tipo:'checklist',modo:'todos',meta:5,moedas:3,grupo:'noite'},
    {id:6,nome:'Remedio da noite',tipo:'checklist',modo:'todos',meta:7,moedas:3,grupo:'noite'},
    {id:7,nome:'Dormir',tipo:'alarme',hora:'21:30',modo:'todos',meta:6,moedas:2,grupo:'noite'}
  ],
  historico:{}
};

let S=null, user=null, aba='hoje', erro='', antes=null, parar=null;
const ADMINS=['KJtN8ctEsRhVvMpVUH6kxrtf0eL2','f9IqZ5SDuKOrbPkD8RxONJhglQn2'];
const admin=()=>!!(user&&ADMINS.includes(user.uid));
const dia=d=>(S.historico[d]=S.historico[d]||{});
const ativas=()=>S.tarefas.filter(t=>t.modo==='todos'||t.modo===S.modo);

async function salvar(...campos){
  const d={};campos.forEach(c=>d[c]=S[c]);
  try{await updateDoc(ref,d)}catch(e){alert('Nao consegui salvar: '+e.message)}
}
function aviso(msg){
  let e=document.getElementById('toast');
  if(!e){e=document.createElement('div');e.id='toast';
    e.style.cssText='position:fixed;top:12px;left:12px;right:12px;background:#3bb273;color:#fff;padding:14px;border-radius:12px;z-index:9;font-weight:700;display:none';
    document.body.appendChild(e)}
  e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',5000);
}
function checarAvisos(novo){
  const h=novo.historico[hoje()]||{};
  if(antes===null){antes={...h};return}
  if(admin()){
    Object.keys(h).filter(id=>!antes[id]).forEach(id=>{
      const t=novo.tarefas.find(x=>String(x.id)===id);
      if(t)aviso('Concluiu: '+t.nome);
    });
  }
  antes={...h};
}

function marcar(id){
  if(admin())return;
  const h=dia(hoje()), t=S.tarefas.find(x=>x.id===id);
  if(h[id]){delete h[id];S.moedas-=t.moedas}
  else{h[id]=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});S.moedas+=t.moedas}
  salvar('historico','moedas');desenhar();
}
function semanaFeita(id){
  let n=0;
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);
    if((S.historico[fmt(d)]||{})[id])n++}
  return n;
}
function atrasada(t){
  if(t.tipo!=='alarme'||dia(hoje())[t.id])return false;
  const a=new Date(),p=t.hora.split(':');
  return a.getHours()*60+a.getMinutes()>(+p[0])*60+(+p[1])+15;
}
function grafico7(){
  const at=ativas();let cols='';
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const hh=S.historico[fmt(d)]||{};
    const n=at.filter(t=>hh[t.id]).length;
    const p=at.length?Math.round(n/at.length*100):0;
    cols+='<div style="flex:1;text-align:center;font-size:12px"><div style="height:100px;display:flex;align-items:flex-end"><div style="width:70%;margin:0 auto;background:#3bb273;height:'+p+'%"></div></div>'+['D','S','T','Q','Q','S','S'][d.getDay()]+'<br>'+p+'%</div>';
  }
  return '<div class="card"><b>Ultimos 7 dias</b><div style="display:flex;margin-top:10px">'+cols+'</div></div>';
}

function telaLogin(){
  return '<div class="card"><b>Entrar</b><input id="l_email" type="email" placeholder="E-mail"><input id="l_senha" type="password" placeholder="Senha"><button onclick="entrar()">Entrar</button><p class="late">'+erro+'</p></div>';
}
async function entrar(){
  erro='';
  try{await signInWithEmailAndPassword(auth,document.getElementById('l_email').value.trim(),document.getElementById('l_senha').value)}
  catch(e){erro='E-mail ou senha incorretos';desenhar()}
}
function sair(){aba='hoje';signOut(auth)}

function telaHoje(){
  let html='';
  ['manha','noite'].forEach(g=>{
    html+='<div class="card"><b>'+(g==='manha'?'Manha':'Noite')+'</b>';
    ativas().filter(t=>t.grupo===g).forEach(t=>{
      const ok=dia(hoje())[t.id];
      html+='<div class="task '+(ok?'done':'')+'"><input type="checkbox" '+(ok?'checked ':'')+(admin()?'disabled ':'')+'onchange="marcar('+t.id+')">'+
      '<div class="info"><div class="name">'+t.nome+'</div><small>'+(t.tipo==='alarme'?'Horario '+t.hora:'Checklist')+' · vale '+t.moedas+' moedas</small>'+
      (atrasada(t)?' <span class="late">Atrasada!</span>':'')+'</div></div>';
    });
    html+='</div>';
  });
  return html;
}
function telaProgresso(){
  let html=grafico7()+'<div class="card"><b>Meta da semana</b>';
  ativas().forEach(t=>{
    const f=semanaFeita(t.id),p=Math.min(100,Math.round(f/t.meta*100));
    html+='<div style="margin-top:12px">'+t.nome+' — '+f+' de '+t.meta+' ('+p+'%)<div class="bar"><div style="width:'+p+'%"></div></div></div>';
  });
  return html+'</div>';
}
function telaPremios(){
  let html='<div class="card"><b>Premios</b>';
  S.premios.forEach(p=>{
    const pct=Math.min(100,Math.round(S.moedas/p.custo*100));
    html+='<div style="margin-top:12px">'+p.nome+' — '+p.custo+' moedas<div class="bar"><div style="width:'+pct+'%;background:#ffb300"></div></div>'+
    (!admin()&&S.moedas>=p.custo?'<button onclick="resgatar(\''+p.nome+'\')">Resgatar</button>':'')+'</div>';
  });
  return html+'</div>';
}
function resgatar(nome){
  const p=S.premios.find(x=>x.nome===nome);
  if(p&&S.moedas>=p.custo&&confirm('Resgatar '+nome+'?')){S.moedas-=p.custo;salvar('moedas');desenhar()}
}
function telaResumo(){
  const h=S.historico[hoje()]||{}, at=ativas();
  const feitas=at.filter(t=>h[t.id]).length, pend=at.filter(t=>!h[t.id]), atr=at.filter(t=>atrasada(t));
  let html='<div class="card"><b>Hoje</b><div style="margin-top:8px">'+feitas+' de '+at.length+' tarefas concluidas</div><div class="bar"><div style="width:'+(at.length?Math.round(feitas/at.length*100):0)+'%"></div></div></div>';
  if(atr.length)html+='<div class="card"><b class="late">Atrasadas</b>'+atr.map(t=>'<div class="task">'+t.nome+' (era '+t.hora+')</div>').join('')+'</div>';
  html+='<div class="card"><b>Pendentes</b>'+(pend.length?pend.map(t=>'<div class="task">'+t.nome+'</div>').join(''):'<div class="task">Tudo feito!</div>')+'</div>';
  return html;
}
function telaAdmin(){
  let html='<div class="card"><b>Horario em uso</b><select onchange="mudarModo(this.value)">'+
  '<option value="tarde" '+(S.modo==='tarde'?'selected':'')+'>Tarde (este ano)</option>'+
  '<option value="manha" '+(S.modo==='manha'?'selected':'')+'>Manha (ano que vem)</option></select></div>';
  html+='<div class="card"><b>Tarefas</b>';
  S.tarefas.forEach(t=>{
    html+='<div class="task"><div class="info"><div class="name">'+t.nome+'</div><small>'+(t.tipo==='alarme'?'Alarme '+t.hora:'Checklist')+' · meta '+t.meta+'/semana · '+t.moedas+' moedas · '+t.modo+'</small></div>'+
    '<button class="red" onclick="remover('+t.id+')">Excluir</button></div>';
  });
  html+='</div>';
  html+='<div class="card"><b>Nova tarefa</b>'+
  '<input id="n_nome" placeholder="Nome da tarefa">'+
  '<select id="n_tipo"><option value="checklist">Checklist</option><option value="alarme">Alarme com horario</option></select>'+
  '<input id="n_hora" type="time" value="08:00">'+
  '<select id="n_grupo"><option value="manha">Manha</option><option value="noite">Noite</option></select>'+
  '<select id="n_modo"><option value="todos">Todos os horarios</option><option value="tarde">So modo tarde</option><option value="manha">So modo manha</option></select>'+
  '<input id="n_meta" type="number" placeholder="Meta por semana (vezes)" value="5">'+
  '<input id="n_moedas" type="number" placeholder="Moedas que vale" value="1">'+
  '<button onclick="adicionar()">Adicionar</button></div>';
  html+='<div class="card"><b>Premios</b>';
  S.premios.forEach((p,i)=>{html+='<div class="task"><div class="info">'+p.nome+' — '+p.custo+' moedas</div><button class="red" onclick="tirarPremio('+i+')">Excluir</button></div>'});
  html+='<input id="p_nome" placeholder="Nome do premio"><input id="p_custo" type="number" placeholder="Custo em moedas"><button onclick="novoPremio()">Adicionar premio</button></div>';
  return html;
}
function mudarModo(m){S.modo=m;salvar('modo');desenhar()}
function adicionar(){
  const nome=document.getElementById('n_nome').value.trim();
  if(!nome)return alert('Digite o nome da tarefa');
  S.tarefas.push({id:Date.now(),nome:nome,tipo:document.getElementById('n_tipo').value,hora:document.getElementById('n_hora').value,
    grupo:document.getElementById('n_grupo').value,modo:document.getElementById('n_modo').value,
    meta:+document.getElementById('n_meta').value||5,moedas:+document.getElementById('n_moedas').value||1});
  salvar('tarefas');desenhar();
}
function remover(id){if(confirm('Excluir esta tarefa?')){S.tarefas=S.tarefas.filter(t=>t.id!==id);salvar('tarefas');desenhar()}}
function novoPremio(){
  const n=document.getElementById('p_nome').value.trim(),c=+document.getElementById('p_custo').value;
  if(n&&c){S.premios.push({nome:n,custo:c});salvar('premios');desenhar()}
}
function tirarPremio(i){S.premios.splice(i,1);salvar('premios');desenhar()}
function ir(a){aba=a;desenhar()}

function desenhar(){
  const t=document.getElementById('title'),c=document.getElementById('coins'),m=document.getElementById('main'),n=document.getElementById('nav');
  if(!user||!S){
    t.textContent='Rotina';c.textContent='';
    m.innerHTML=!user?telaLogin():'<div class="card">'+(erro||'Carregando...')+'</div>';
    n.innerHTML='';return;
  }
  t.textContent=admin()?'Administrador':'Minha rotina';
  c.textContent=S.moedas+' moedas';
  const telas={hoje:telaHoje,progresso:telaProgresso,premios:telaPremios,resumo:telaResumo,admin:telaAdmin};
  if(!telas[aba]||((aba==='resumo'||aba==='admin')&&!admin()))aba='hoje';
  m.innerHTML=telas[aba]();
  const abas=[['hoje','Hoje'],['progresso','Metas'],['premios','Premios']];
  if(admin())abas.push(['resumo','Resumo'],['admin','Config']);
  n.innerHTML=abas.map(a=>'<button class="'+(aba===a[0]?'active':'')+'" onclick="ir(\''+a[0]+'\')">'+a[1]+'</button>').join('')+'<button onclick="sair()">Sair</button>';
}

onAuthStateChanged(auth,async u=>{
  user=u;S=null;antes=null;
  if(parar){parar();parar=null}
  desenhar();
  if(!u)return;
  try{
    const s=await getDoc(ref);
    if(!s.exists()){
      try{await setDoc(ref,padrao)}
      catch(e){erro='Peca a um administrador para entrar primeiro.';await signOut(auth);return}
    }
    parar=onSnapshot(ref,sn=>{
      if(!sn.exists())return;
      S=sn.data();checarAvisos(S);
      const digitando=aba==='admin'&&document.activeElement&&document.activeElement.tagName==='INPUT';
      if(!digitando)desenhar();
    },e=>{erro=e.message;desenhar()});
  }catch(e){erro='Erro: '+e.message;desenhar()}
});

setInterval(()=>{if(S&&aba==='hoje')desenhar()},60000);
Object.assign(window,{marcar,resgatar,adicionar,remover,novoPremio,tirarPremio,mudarModo,ir,entrar,sair});
</script>
</body>
</html>
