let S=null, user=null, aba='hoje', erro='', antes=null, antesP=null, antesB=null, antesE=0, parar=null;

const NOMEDIA=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
const diasDe=t=>(t.dias&&t.dias.length)?t.dias:[0,1,2,3,4,5,6];
const folgaDe=ds=>((S&&S.folgas)||{})[ds]||null;
const valeNoDia=(t,d)=>diasDe(t).includes(d.getDay())&&!folgaDe(fmt(d));
const valeHoje=t=>valeNoDia(t,new Date());
const doModo=()=>S.tarefas.filter(t=>t.modo==='todos'||t.modo===S.modo);

const metaSemana=t=>{const sg=segundaDaSemana();let n=0;for(let i=0;i<7;i++){if(valeNoDia(t,addDias(sg,i)))n++}return n};
const limpar=(s,n)=>String(s==null?'':s).replace(/[\u0000-\u001f\u007f\u202a-\u202e]/g,'').trim().slice(0,n);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

const HUMOR_KEY='_humor';

const nomeImp=k=>{const x=IMPS.find(i=>i.k===k);return x?x.n:''};
const moedasDe=t=>(t&&t.imp&&cfgImp()[t.imp]!=null)?(+cfgImp()[t.imp]||0):(+(t&&t.moedas)||0);

async function salvar(...campos){
  const d={};campos.forEach(c=>{d[c]=S[c]});
  try{await updateDoc(ref,d)}catch(e){alert('Nao consegui salvar: '+e.message)}
}
async function gravar(d){
  try{await updateDoc(ref,d)}catch(e){alert('Nao consegui salvar: '+e.message)}
}
async function transacao(fn){
  try{
    return await runTransaction(db,async tx=>{
      const sn=await tx.get(ref);const d=sn.data()||{};
      const r=fn(d);if(!r)return false;
      tx.update(ref,r);return true;
    });
  }catch(e){alert('Nao consegui salvar: '+e.message);return false}
}
function logar(k,x){
  try{
    setDoc(doc(db,'log',mesDe(new Date())),{itens:arrayUnion({t:Date.now(),q:quem(),k:k,x:limpar(x,200)})},{merge:true}).catch(e=>console.log('log',e.message));
  }catch(e){console.log('log',e.message)}
}

function aviso(msg){
  let e=document.getElementById('toast');
  if(!e){e=document.createElement('div');e.id='toast';
    e.style.cssText='position:fixed;top:12px;left:12px;right:12px;background:#3bb273;color:#fff;padding:14px;border-radius:12px;z-index:200;font-weight:700;display:none';
    document.body.appendChild(e)}
  e.textContent=msg;e.style.display='block';setTimeout(()=>{e.style.display='none'},5000);
}
function checarAvisos(novo){
  const h=(novo.historico||{})[hoje()]||{};
  const snap={};Object.keys(h).forEach(k=>{if(k!==HUMOR_KEY)snap[k]=estado(h[k])});
  const np=Object.keys(novo.pedidos||{}).length;
  const nb=Object.values(novo.bemReg||{}).filter(b=>b.s==='pendente').length;
  const ne=Object.keys(h).filter(k=>k!==HUMOR_KEY&&h[k]&&typeof h[k]==='object'&&h[k].e).length+Object.values(novo.bemReg||{}).filter(b=>b.e).length;
  if(antes===null){antes=snap;antesP=np;antesB=nb;antesE=ne;return}
  if(!admin()&&ne>antesE)aviso('💬 Seus pais mandaram um elogio!');
  if(admin()){
    Object.keys(snap).filter(id=>!antes[id]).forEach(id=>{
      const t=(novo.tarefas||[]).find(x=>String(x.id)===id);
      if(t)aviso((snap[id]==='pendente'?'Aguardando aprovacao: ':'Concluiu: ')+t.nome);
    });
    if(np>antesP)aviso('O João enviou um pedido de prêmios');
    if(nb>antesB)aviso('Atitude do bem aguardando aprovação');
  }
  antes=snap;antesP=np;antesB=nb;antesE=ne;
}

function fraseDoDia(){
  const d=new Date();
  const n=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,0,1))/86400000);
  return FRASES[((n%FRASES.length)+FRASES.length)%FRASES.length];
}

let ac=null;
function audio(){
  try{
    if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C()}
    if(ac.state==='suspended')ac.resume();
    return ac;
  }catch(e){return null}
}
function nota(f,t0,dur,vol,tipo){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=tipo;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+0.05);
}
function tocar(tipo){
  if(!S||S.som===false)return;
  const c=audio();if(!c)return;
  try{
    const t=c.currentTime;
    if(tipo==='bem')[659.25,783.99,987.77,1318.51,1567.98].forEach((f,i)=>nota(f,t+i*0.11,0.8,0.12,'sine'));
    else if(tipo==='riso')[880,988,880,988,1047,988].forEach((f,i)=>nota(f,t+i*0.07,0.12,0.09,'square'));
    else if(tipo==='danca')[523.25,659.25,523.25,783.99,659.25,783.99,1046.5].forEach((f,i)=>nota(f,t+i*0.1,0.18,0.12,'triangle'));
    else if(tipo==='joia')[783.99,1046.5].forEach((f,i)=>nota(f,t+i*0.12,0.3,0.14,'sine'));
    else if(tipo==='comer')[440,587.33,740].forEach((f,i)=>nota(f,t+i*0.07,0.12,0.12,'sine'));
    else [523.25,659.25,783.99].forEach((f,i)=>nota(f,t+i*0.09,0.4,0.16,'triangle'));
  }catch(e){}
}

const FIGS=['🚀','🐉','🦈','⚡','🪐','🏎️','🦖','🏀','⚽','🦅','🦁','🐺','🌋','🏔️','🥇','🛡️','⚔️','🏹','🧙','🤖','👾','🎮','🚁','✈️','🛸','🌌','☄️','🔭','🦊','🐯','🦍','🐙','🦎','🐊','🦂','🦇','🏄','⛷️','🧗','🎯','🏏','🏓','🥊','🎸','🧨','💎','🧭','🏴‍☠️','🥝','🌪️'];
const NIVEIS={bronze:{nome:'Bronze',cor:'#cd7f32'},prata:{nome:'Prata',cor:'#9aa5b1'},ouro:{nome:'Ouro',cor:'#e6b800'}};
const cfgSemana=()=>Object.assign({bronze:90,prata:95,ouro:100,bBronze:5,bPrata:8,bOuro:12},S.cfgSemana||{});
function segundaDaSemana(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function percentualSemana(seg){
  let esp=0,feito=0;
  for(let i=0;i<7;i++){
    const d=new Date(seg);d.setDate(seg.getDate()+i);
    const h=S.historico[fmt(d)]||{};
    doModo().filter(t=>valeNoDia(t,d)).forEach(t=>{
      esp++;
      const e=estado(h[t.id]);
      if(e==='feita'||e==='aprovada')feito++;
    });
  }
  return esp?Math.round(feito/esp*100):null;
}
function nivelDe(p){
  const c=cfgSemana();
  if(p>=c.ouro)return 'ouro';
  if(p>=c.prata)return 'prata';
  if(p>=c.bronze)return 'bronze';
  return null;
}
async function fecharSemanas(){
  if(!admin()||!S)return;
  S.conquistas=S.conquistas||[];
  S.semanasFechadas=S.semanasFechadas||[];
  const atual=segundaDaSemana();
  let mudou=false;const novas=[],fechadas=[];
  for(let k=1;k<=8;k++){
    const seg=new Date(atual);seg.setDate(atual.getDate()-7*k);
    const chave=fmt(seg);
    if(S.semanasFechadas.includes(chave))continue;
    const p=percentualSemana(seg);
    S.semanasFechadas.push(chave);fechadas.push(chave);mudou=true;
    if(p===null)continue;
    const n=nivelDe(p);
    if(!n)continue;
    const c=cfgSemana();
    const bonus={bronze:c.bBronze,prata:c.bPrata,ouro:c.bOuro}[n];
    const usadas=S.conquistas.map(x=>x.fig);
    let livres=FIGS.filter(f=>!usadas.includes(f));
    if(!livres.length)livres=FIGS.slice();
    const fig=livres[Math.floor(Math.random()*livres.length)];
    const conq={semana:chave,pct:p,nivel:n,bonus:bonus,fig:fig};
    S.conquistas.push(conq);
    novas.push(conq);
  }
  if(mudou){
    try{
      const ok=await runTransaction(db,async tx=>{
        const sn=await tx.get(ref);
        const d=sn.data()||{};
        const jaFechadas=d.semanasFechadas||[];
        const fechar=fechadas.filter(x=>!jaFechadas.includes(x));
        if(!fechar.length)return false;
        const conqNovas=novas.filter(x=>fechar.includes(x.semana));
        const bonusReal=conqNovas.reduce((a,x)=>a+x.bonus,0);
        const upd={semanasFechadas:jaFechadas.concat(fechar)};
        if(conqNovas.length)upd.conquistas=(d.conquistas||[]).concat(conqNovas);
        if(bonusReal)upd.moedas=(d.moedas||0)+bonusReal;
        tx.update(ref,upd);
        return conqNovas.length?conqNovas:true;
      });
      if(Array.isArray(ok))logar('semana','Semana fechada: '+ok.map(c=>c.semana+' '+c.nivel+' (+'+c.bonus+')').join(', '));
    }catch(e){alert('Nao consegui fechar a semana: '+e.message)}
  }
}
const temEspecial=id=>((S&&S.especiais)||[]).some(e=>e.id===id);

}

  return html;

function saudacao(){
  const h=new Date().getHours();
  const bicho=BICHOS[new Date().getDay()%BICHOS.length];
  const s=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const at=ativas();
  const est=t=>estado(dia(hoje())[t.id]);
  const feitas=at.filter(t=>['feita','aprovada'].includes(est(t))).length;
  const aguard=at.filter(t=>est(t)==='pendente').length;
  const tot=at.length;
  const pct=tot?Math.round(feitas/tot*100):0;
  const msg=folgaDe(hoje())?'Hoje é dia de folga. Descanse e aproveite!':tot===0?'Hoje não tem tarefas. Aproveite!':(feitas+aguard)===0?'Vamos começar? Você consegue!':feitas===tot?'Missão cumprida! Você é demais!':(feitas+aguard)===tot?'Tudo enviado! Agora é só esperar os pais aprovarem.':'Muito bem! Falta pouco!';
  return '<div class="saud"><div class="bicho">'+bicho+'</div><h2>'+s+', João!</h2><div class="rotulo-msg">Mensagem do Dia</div><div class="frase">'+esc(fraseDoDia())+'</div><div style="margin:10px 12px 0;text-align:left;font-size:13px;color:#14507a;font-weight:700">'+feitas+' de '+tot+' tarefas aprovadas'+(aguard?' · '+aguard+' aguardando aprovação':'')+'</div><div class="bar" style="margin:4px 12px 0;height:20px;background:#ffffffaa"><div style="width:'+pct+'%;background:linear-gradient(90deg,#3bb273,#9be15d);height:100%"></div></div><p style="margin-top:10px">'+msg+'</p>'+blocoHumor()+'</div>';
}

/* ---------- tarefas: marcar, aprovar, rejeitar ---------- */
function marcar(id){
  if(admin())return;
  const h=dia(hoje()), t=S.tarefas.find(x=>x.id===id);
  if(!t)return;
  audio();
  const e=estado(h[id]);
  if(e==='rejeitada'||e==='aprovada')return;
  const cam='historico.'+hoje()+'.'+id;
  if(e==='pendente'){delete h[id];gravar({[cam]:deleteField()});logar('tarefa','João desmarcou: '+t.nome);desenhar();return}
  if(e==='feita'){
    const v=(h[id]&&typeof h[id]==='object'&&h[id].v!=null)?h[id].v:moedasDe(t);
    delete h[id];S.moedas-=v;
    gravar({[cam]:deleteField(),moedas:increment(-v)});
    logar('tarefa','João desmarcou: '+t.nome+' (-'+v+' moedas)');
    desenhar();return;
  }
  const v=moedasDe(t);
  if(exigeAprov()){
    h[id]={s:'pendente',h:hora()};gravar({[cam]:h[id]});
    logar('tarefa','João marcou (aguarda aprovação): '+t.nome);
  }else{
    h[id]={s:'feita',h:hora(),v:v};S.moedas+=v;
    gravar({[cam]:h[id],moedas:increment(v)});
    logar('tarefa','João concluiu: '+t.nome+' (+'+v+' moedas)');
  }
  desenhar();confete();tocar('tarefa');
}
async function aprovar(data,id,comElogio){
  const t=S.tarefas.find(x=>x.id===id);if(!t)return;
  const v=moedasDe(t);
  let e='';
  if(comElogio){const raw=prompt('Escreva um elogio para o João (opcional). Ele vai ler.');if(raw===null)return;e=limpar(raw,140)}
  const ok=await transacao(d=>{
    const r=((d.historico||{})[data]||{})[id];
    if(!r||estado(r)!=='pendente')return null;
    const rec={s:'aprovada',h:r.h||'',v:v,p:quem()};if(e)rec.e=e;
    return {['historico.'+data+'.'+id]:rec,moedas:(d.moedas||0)+v};
  });
  if(ok)logar('aprovação',quem()+' aprovou: '+t.nome+' ('+br(data)+', +'+v+' moedas)'+(e?' — elogio: '+e:''));
  else aviso('Esta tarefa já foi tratada.');
}

function mudarAprovacao(v){
  S.exigirAprovacao=v;
  const upd={exigirAprovacao:v};
  if(!v){
    let soma=0;
    Object.keys(S.historico).forEach(data=>{
      const h=S.historico[data];
      Object.keys(h).forEach(id=>{
        if(id!==HUMOR_KEY&&estado(h[id])==='pendente'){
          const t=S.tarefas.find(x=>String(x.id)===id);
          const vv=t?moedasDe(t):0;
          h[id]={s:'aprovada',h:h[id].h||'',v:vv,p:quem()};
          upd['historico.'+data+'.'+id]=h[id];
          soma+=vv;
        }
      });
    });
    Object.keys(S.bemReg||{}).forEach(id=>{
      const b=S.bemReg[id];
      if(b.s==='pendente'&&!b.livre){b.s='aprovada';b.p=quem();upd['bemReg.'+id+'.s']='aprovada';upd['bemReg.'+id+'.p']=quem();soma+=(+b.moedas||0)}
    });
    if(soma){upd.moedas=increment(soma);S.moedas+=soma}
  }
  gravar(upd);
  logar('config','Aprovação de tarefas '+(v?'ligada':'desligada'));
  desenhar();
}
function pendentesAprov(){
  const l=[];
  Object.keys(S.historico).sort().forEach(data=>{
    const h=S.historico[data];
    Object.keys(h).forEach(id=>{
      if(id!==HUMOR_KEY&&estado(h[id])==='pendente'){
        const t=S.tarefas.find(x=>String(x.id)===id);
        if(t)l.push({data:data,t:t,h:h[id].h});
      }
    });
  });
  return l;
}

async function assumir(pid,ik){
  const p=(S.pedidos||{})[pid];const it=p&&p.itens&&p.itens[ik];if(!it)return;
  if(!confirm(it.doa?'Você vai fazer a doação "'+it.nome+'" em nome do João? As '+(+it.custo||0)+' moedas saem do saldo dele agora.':'Você vai dar "'+it.nome+'" ao João? As '+(+it.custo||0)+' moedas saem do saldo dele agora.'))return;
  let motivo='';
  const ok=await transacao(d=>{
    const x=(((d.pedidos||{})[pid]||{}).itens||{})[ik];
    if(!x||x.s!=='pedido'){motivo='ja';return null}

    if((d.moedas||0)<c&&!d.saldoNegativo){motivo='saldo';return null}
    const b='pedidos.'+pid+'.itens.'+ik;
    return {[b+'.s']:'assumido',[b+'.por']:quem(),[b+'.dAss']:hoje(),moedas:(d.moedas||0)-c};
  });

  else if(motivo==='saldo')alert('O João não tem moedas suficientes agora. Recuse o item ou espere.');

function conversaSemana(){
  const seg=segundaDaSemana(),M=mapas();
  const C=agrega(fmt(seg),hoje(),M),P=agrega(fmt(addDias(seg,-7)),fmt(addDias(seg,-1)),M);
  const l=[];
  Object.keys(C.porT).forEach(id=>{
    const o=C.porT[id],q=P.porT[id],t=S.tarefas.find(x=>String(x.id)===id);
    if(!t||!o.esp)return;
    const pc=Math.round((o.feito+o.pend)/o.esp*100);
    const pp=(q&&q.esp)?Math.round((q.feito+q.pend)/q.esp*100):null;
    l.push({nome:t.nome,pc:pc,pp:pp,d:pp===null?null:pc-pp,nm:o.nm||0,esp:o.esp});
  });
  let html='<div class="card"><b>💬 Conversa da semana</b><div style="font-size:12px;color:#777">Da segunda até hoje, comparada com a semana passada.</div>';
  if(!l.length)return html+'<div style="margin-top:8px;color:#777">Ainda não há dados suficientes esta semana.</div></div>';
  const mel=l.filter(x=>x.d!==null&&x.d>0).sort((a,b)=>b.d-a.d||b.pc-a.pc)[0];
  const aten=l.filter(x=>x.pc<100).sort((a,b)=>a.pc-b.pc||b.nm-a.nm)[0];
  if(mel)html+='<div class="ins" style="margin-top:10px">✨ <b>Mais melhorou:</b> '+esc(mel.nome)+' ('+mel.pp+'% → '+mel.pc+'%).<br><small style="color:#555">Puxe assunto: “O que te ajudou a ir melhor em '+esc(mel.nome)+'?”</small></div>';
  else html+='<div class="ins" style="margin-top:10px">✨ Nenhuma tarefa melhorou em relação à semana passada ainda. Que tal elogiar o esforço geral?</div>';
  if(aten)html+='<div class="ins">⚠️ <b>Merece atenção:</b> '+esc(aten.nome)+' ('+aten.pc+'%'+(aten.nm?', '+aten.nm+' sem marcar':'')+').<br><small style="color:#555">Puxe assunto: “O que está dificultando '+esc(aten.nome)+'? Como posso ajudar?”</small></div>';
  else html+='<div class="ins">🎉 Nenhuma tarefa pede atenção: tudo 100% até agora!</div>';
  return html+'</div>';
}

const br=ds=>String(ds||'').slice(8)+'/'+String(ds||'').slice(5,7);
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const addDias=(d,n)=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()+n);return x};
const segundaDeData=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
function datasEntre(a,b){
  const l=[];const d=new Date(a+'T12:00:00');const f=new Date(b+'T12:00:00');let n=0;
  while(d<=f&&n<4000){l.push(fmt(d));d.setDate(d.getDate()+1);n++}
  return l;
}
function inicioDados(){
  let m=hoje();
  Object.keys(S.historico||{}).forEach(k=>{if(k<m)m=k});
  S.tarefas.forEach(t=>{if(t.id>1e12){const k=fmt(new Date(t.id));if(k<m)m=k}});
  return m;
}
const criadaApos=(t,ds)=>t.id>1e12&&fmt(new Date(t.id))>ds;
function mapas(){
  const col={},gas={},per={},doa={},bic={};
  const add=(m,k,v)=>{if(k)m[k]=(m[k]||0)+v};
  Object.keys(S.historico||{}).forEach(ds=>{
    const h=S.historico[ds];
    Object.keys(h).forEach(id=>{
      if(id===HUMOR_KEY)return;
      const e=estado(h[id]);
      if(e==='aprovada'||e==='feita'){
        const t=S.tarefas.find(x=>String(x.id)===id);
        const v=(h[id]&&typeof h[id]==='object'&&h[id].v!=null)?(+h[id].v||0):(t?moedasDe(t):0);
        add(col,ds,v);
      }
    });
  });
  Object.values(S.bemReg||{}).forEach(b=>{if(b.s==='aprovada')add(col,b.data,+b.moedas||0)});
  (S.conquistas||[]).forEach(c=>{add(col,fmt(addDias(new Date(c.semana+'T12:00:00'),6)),+c.bonus||0)});
  Object.values(S.pedidos||{}).forEach(p=>Object.values(p.itens||{}).forEach(it=>{if(it.s==='assumido'||it.s==='entregue')add(it.doa?doa:gas,it.dAss||p.data,+it.custo||0)}));
  (S.descontos||[]).forEach(d=>add(per,d.data,+d.valor||0));
  Object.keys(baseBicho().gasto||{}).forEach(ds=>add(bic,ds,+baseBicho().gasto[ds]||0));
  return {col:col,gas:gas,per:per,doa:doa,bic:bic};
}
function agrega(ini,fim,M,filtro){
  const r={esp:0,feito:0,rej:0,pend:0,col:0,gas:0,per:0,doa:0,bic:0,porT:{}};
  const hj=hoje();
  const i0=inicioDados();
  datasEntre(ini,fim).forEach(ds=>{
    if(ds>hj||ds<i0)return;
    const d=new Date(ds+'T12:00:00');const h=(S.historico||{})[ds]||{};
    doModo().forEach(t=>{
      if(filtro&&!filtro(t))return;
      if(!valeNoDia(t,d)||criadaApos(t,ds))return;
      const e=estado(h[t.id]);
      if(ds===hj&&!e)return;
      const o=r.porT[t.id]=r.porT[t.id]||{esp:0,feito:0,rej:0,pend:0,nm:0};
      r.esp++;o.esp++;
      if(!e)o.nm++;
      if(e==='feita'||e==='aprovada'){r.feito++;o.feito++}
      else if(e==='rejeitada'){r.rej++;o.rej++}
      else if(e==='pendente'){r.pend++;o.pend++}
    });
    r.col+=M.col[ds]||0;r.gas+=M.gas[ds]||0;r.per+=M.per[ds]||0;r.doa+=(M.doa||{})[ds]||0;r.bic+=(M.bic||{})[ds]||0;
  });
  return r;
}
function baldes(){
  const hj=hoje();
  const r=new Date(ui.ref);r.setHours(12,0,0,0);
  const per=ui.per;
  if(per==='dia'){
    const s=fmt(r);
    return {titulo:(s===hj?'Hoje, ':'')+br(s)+'/'+s.slice(0,4),ini:s,fim:s,itens:[['manha','Manhã'],['tarde','Tarde'],['noite','Noite']].map(x=>({l:x[1],ini:s,fim:s,f:t=>periodo(t)===x[0]}))};
  }
  if(per==='semana'){
    const seg=segundaDeData(r);const itens=[];
    for(let i=0;i<7;i++){const d=addDias(seg,i),s=fmt(d);itens.push({l:NOMEDIA[d.getDay()]+' '+s.slice(8),ini:s,fim:s})}
    return {titulo:'Semana de '+br(itens[0].ini)+' a '+br(itens[6].ini),ini:itens[0].ini,fim:itens[6].fim,itens:itens};
  }
  if(per==='mes'){
    const y=r.getFullYear(),m=r.getMonth(),ult=new Date(y,m+1,0).getDate();const itens=[];
    for(let i=1;i<=ult;i++){const s=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');itens.push({l:String(i),ini:s,fim:s})}
    return {titulo:MESES[m]+' de '+y,ini:itens[0].ini,fim:itens[ult-1].fim,itens:itens};
  }
  if(per==='ano'){
    const y=r.getFullYear(),itens=[];
    for(let m=0;m<12;m++){const ult=new Date(y,m+1,0).getDate(),mm=String(m+1).padStart(2,'0');itens.push({l:MESES[m].slice(0,3),ini:y+'-'+mm+'-01',fim:y+'-'+mm+'-'+String(ult).padStart(2,'0')})}
    return {titulo:String(y),ini:itens[0].ini,fim:itens[11].fim,itens:itens};
  }
  const ini=inicioDados(),itens=[];
  const d0=new Date(ini+'T12:00:00');
  const dias=Math.round((new Date(hj+'T12:00:00')-d0)/86400000);
  if(dias<=140){
    let seg=segundaDeData(d0);
    while(fmt(seg)<=hj){itens.push({l:br(fmt(seg)),ini:fmt(seg),fim:fmt(addDias(seg,6))});seg=addDias(seg,7)}
  }else{
    let y=d0.getFullYear(),m=d0.getMonth();const n=new Date();
    while(y*12+m<=n.getFullYear()*12+n.getMonth()){
      const ult=new Date(y,m+1,0).getDate(),mm=String(m+1).padStart(2,'0');
      itens.push({l:MESES[m].slice(0,3)+'/'+String(y).slice(2),ini:y+'-'+mm+'-01',fim:y+'-'+mm+'-'+String(ult).padStart(2,'0')});
      m++;if(m>11){m=0;y++}
    }
  }
  return {titulo:'Desde '+br(ini)+'/'+ini.slice(0,4),ini:itens[0].ini,fim:itens[itens.length-1].fim,itens:itens};
}
function setPer(p){ui.per=p;ui.ref=new Date();desenhar()}
function moverPer(n){
  const r=new Date(ui.ref);r.setHours(12,0,0,0);
  if(ui.per==='dia')r.setDate(r.getDate()+n);
  else if(ui.per==='semana')r.setDate(r.getDate()+7*n);
  else if(ui.per==='mes')r.setMonth(r.getMonth()+n,1);
  else if(ui.per==='ano')r.setFullYear(r.getFullYear()+n,0,1);
  const hj=new Date();hj.setHours(12,0,0,0);
  ui.ref=r>hj?hj:r;
  desenhar();
}
function graf(labels,series,o){
  const W=320,H=170,pl=30,pr=6,pt=12,pb=24;
  const n=labels.length;
  if(!n)return '<div style="color:#777">Sem dados</div>';
  const mx=o.max!=null?o.max:Math.max(1,...series.flatMap(s=>s.v.map(x=>+x||0)));
  const iw=W-pl-pr,ih=H-pt-pb;
  const sy=v=>pt+ih-(Math.min(+v||0,mx)/mx)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  [0,0.5,1].forEach(f=>{const y=pt+ih-f*ih;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#e3e7ee"/><text x="'+(pl-4)+'" y="'+(y+3)+'" font-size="9" text-anchor="end" fill="#777">'+Math.round(mx*f)+'</text>'});
  const bw=iw/n;
  if(o.tipo==='linha'){
    series.forEach(se=>{
      const pts=se.v.map((v,i)=>(pl+bw*i+bw/2)+','+sy(v)).join(' ');
      s+='<polyline fill="none" stroke="'+se.cor+'" stroke-width="2.5" points="'+pts+'"/>';
      if(n<=40)se.v.forEach((v,i)=>{s+='<circle cx="'+(pl+bw*i+bw/2)+'" cy="'+sy(v)+'" r="2.5" fill="'+se.cor+'"/>'});
    });
  }else{
    const k=series.length,gw=bw*0.8,sw=gw/k;
    series.forEach((se,j)=>se.v.forEach((v,i)=>{
      const x=pl+bw*i+(bw-gw)/2+sw*j,y=sy(v);
      s+='<rect x="'+x+'" y="'+y+'" width="'+Math.max(1,sw-1)+'" height="'+Math.max(0,pt+ih-y)+'" rx="2" fill="'+se.cor+'"/>';
      if(n<=12&&(+v||0)>0)s+='<text x="'+(x+sw/2)+'" y="'+(y-2)+'" font-size="8" text-anchor="middle" fill="#444">'+(o.fmt?o.fmt(v):v)+'</text>';
    }));
  }
  const passo=Math.ceil(n/8);
  labels.forEach((l,i)=>{if(i%passo===0)s+='<text x="'+(pl+bw*i+bw/2)+'" y="'+(H-8)+'" font-size="9" text-anchor="middle" fill="#555">'+esc(l)+'</text>'});
  s+='</svg>';
  s+='<div style="font-size:'+(o.mini?9:12)+'px;margin-top:4px">'+series.map(se=>'<span style="display:inline-block;width:10px;height:10px;background:'+se.cor+';border-radius:2px;margin-right:4px"></span>'+esc(se.nome)).join(' &nbsp; ')+'</div>';
  return s;
}

const STOP=new Set(['de','da','do','das','dos','as','os','em','na','no','nas','nos','uma','que','nao','foi','ser','para','por','com','mas','ainda','muito','mais','porque','isso','isto','esta','estava','tava','voce','mesmo','tem','ter','fez','fazer','feita','feito','tarefa','ele','ela','sua','seu','meu','minha','como','quando','pois','nem','aos','pela','pelo','esse','essa','sem','era','sao','estou','esta']);
function analiseRej(ini,fim){
  const rej=[];
  datasEntre(ini,fim).forEach(ds=>{
    if(ds>hoje())return;
    const h=(S.historico||{})[ds]||{};
    Object.keys(h).forEach(id=>{
      if(id===HUMOR_KEY)return;
      const r=h[id];
      if(estado(r)==='rejeitada'){
        const t=S.tarefas.find(x=>String(x.id)===id);
        rej.push({ds:ds,id:id,t:t,m:(r&&typeof r==='object'&&r.m)?r.m:''});
      }
    });
  });
  const porT={};
  rej.forEach(x=>{const k=x.t?x.t.nome:'(tarefa removida)';porT[k]=(porT[k]||0)+1});
  const top=Object.keys(porT).map(k=>({l:k,v:porT[k],sub:porT[k]+'×'})).sort((a,b)=>b.v-a.v).slice(0,5);
  const mot={};
  rej.forEach(x=>{if(!x.m)return;const k=semAcento(x.m);mot[k]=mot[k]||{n:0,txt:x.m};mot[k].n++});
  const motivos=Object.values(mot).sort((a,b)=>b.n-a.n).slice(0,5);
  const pal={};
  rej.forEach(x=>{if(!x.m)return;semAcento(x.m).split(/[^a-z0-9]+/).forEach(w=>{if(w.length>=4&&!STOP.has(w))pal[w]=(pal[w]||0)+1})});
  const palavras=Object.keys(pal).map(w=>({w:w,n:pal[w]})).sort((a,b)=>b.n-a.n).slice(0,6);
  const per={manha:0,tarde:0,noite:0};
  rej.forEach(x=>{if(x.t)per[periodo(x.t)]++});
  const sem={};
  rej.forEach(x=>{const d=new Date(x.ds+'T12:00:00').getDay();sem[d]=(sem[d]||0)+1});
  return {total:rej.length,top:top,motivos:motivos,palavras:palavras,per:per,sem:sem,semMotivo:rej.filter(x=>!x.m).length};
}
function insightsRej(R,marcadas){
  const ins=[];
  if(!R.total){ins.push('Nenhuma tarefa rejeitada neste período.');return ins}
  const pct=marcadas?Math.round(R.total/marcadas*100):0;
  ins.push(R.total+' rejeição(ões) neste período'+(marcadas?', cerca de '+pct+'% das tarefas marcadas.':'.'));
  if(R.top[0])ins.push('A tarefa mais rejeitada foi "'+R.top[0].l+'" ('+R.top[0].v+'×).');
  if(R.motivos[0]&&R.motivos[0].n>=2)ins.push('O motivo que mais se repete: "'+R.motivos[0].txt+'" ('+R.motivos[0].n+'×).');
  const pk=Object.keys(R.per).sort((a,b)=>R.per[b]-R.per[a])[0];
  if(R.per[pk]>0)ins.push('A maioria das rejeições acontece em tarefas da '+NOMEP[pk].toLowerCase()+' ('+R.per[pk]+' de '+R.total+').');
  const dk=Object.keys(R.sem).sort((a,b)=>R.sem[b]-R.sem[a])[0];
  if(dk!==undefined&&R.total>=3)ins.push('O dia da semana com mais rejeições é '+NOMEDIA[dk]+' ('+R.sem[dk]+').');
  if(R.palavras.length)ins.push('Palavras mais citadas nos motivos: '+R.palavras.map(p=>p.w+' ('+p.n+')').join(', ')+'.');
  if(R.semMotivo)ins.push(R.semMotivo+' rejeição(ões) sem motivo registrado. Anote sempre o motivo para esta análise melhorar.');
  return ins;
}

  const sc=per==='dia'?[T.col]:A.map(a=>a.col);
  const sg=per==='dia'?[T.gas]:A.map(a=>a.gas);
  html+='<div class="card"><div class="duo"><div><b style="font-size:12px">Engajamento do João</b><div style="font-size:9px;color:#777">% das tarefas esperadas que ele marcou.</div>'+graf(B.itens.map(b=>b.l),[{nome:'Engajamento %',cor:'#3bb273',v:A.map(eng)}],{tipo:linha?'linha':'barra',max:100,fmt:v=>v+'%',mini:1})+'</div><div><b style="font-size:12px">Moedas ganhas e gastas</b><div style="font-size:9px;color:#777">Saldo atual: '+S.moedas+' moedas</div>'+graf(lblC,[{nome:'Ganhas',cor:'#3bb273',v:sc},{nome:'Gastas',cor:'#ff9800',v:sg}],{tipo:linha?'linha':'barra',mini:1})+'</div></div></div>';
  const lt=Object.keys(T.porT).map(id=>{
    const o=T.porT[id];const t=S.tarefas.find(x=>String(x.id)===id);const fe=o.feito+o.pend;
    return {l:t?t.nome:'(removida)',esp:o.esp,fe:fe,nm:o.nm||0,v:o.esp?Math.round(fe/o.esp*100):0};
  }).filter(x=>x.esp>0);
  const fmtT=x=>({l:x.l,v:x.v,sub:x.v+'% ('+x.fe+' de '+x.esp+(x.nm?', '+x.nm+' sem marcar':'')+')'});
  const best=lt.slice().sort((a,b)=>b.v-a.v||b.esp-a.esp).slice(0,5).map(fmtT);
  const nao=x=>x.esp-x.fe;
  const worst=lt.filter(x=>nao(x)>0).sort((a,b)=>(nao(b)/b.esp)-(nao(a)/a.esp)||nao(b)-nao(a)||b.esp-a.esp).slice(0,5).map(x=>({l:x.l,v:Math.round(nao(x)/x.esp*100),sub:Math.round(nao(x)/x.esp*100)+'% não cumprida ('+nao(x)+' de '+x.esp+(x.nm?', '+x.nm+' sem marcar':'')+')'}));
  html+='<div class="card"><b>5 tarefas mais cumpridas</b>'+(best.length?hbar(best,'#3bb273',100):'<div style="color:#777;margin-top:6px">Sem dados no período.</div>')+'</div>';
  html+='<div class="card"><b>5 tarefas menos cumpridas</b>'+(worst.length?hbar(worst,'#d43b3b',100):'<div style="color:#777;margin-top:6px">Sem dados no período.</div>')+'<small style="color:#777;display:block;margin-top:8px">Ordem do maior para o menor percentual de não cumprimento. Tarefa que o João não marcou até o fim do dia conta como não cumprida; rejeitada também. O dia de hoje só entra se a tarefa já foi marcada; o que ficar sem marcar passa a contar na virada do dia.</small></div>';
  const pm={};
  (S.descontos||[]).forEach(d=>{if(d.data>=B.ini&&d.data<=B.fim){const k=d.motivo||'?';pm[k]=pm[k]||{n:0,v:0};pm[k].n++;pm[k].v+=+d.valor||0}});
  const pl=Object.keys(pm).map(k=>({l:k,v:pm[k].v,sub:pm[k].n+'× · -'+pm[k].v+' moedas'})).sort((a,b)=>b.v-a.v).slice(0,5);
  html+='<div class="card"><b>5 penalidades que mais tiraram moedas</b><div style="font-size:13px;margin-top:4px">Total perdido no período: <b class="late">-'+T.per+'</b> moedas</div>'+(pl.length?hbar(pl,'#d43b3b'):'<div style="color:#777;margin-top:6px">Nenhuma penalidade no período.</div>')+'</div>';
  const R=analiseRej(B.ini,B.fim);
  const marcadas=T.feito+T.pend+T.rej;
  html+='<div class="card"><b>Tarefas rejeitadas</b>'+(R.top.length?hbar(R.top,'#ff7a59'):'')+(R.motivos.length?'<div style="margin-top:10px;font-weight:700;font-size:14px">Motivos mais citados</div>'+R.motivos.map(m=>'<div class="ins">• '+esc(m.txt)+' ('+m.n+'×)</div>').join(''):'')+'<div style="margin-top:10px;font-weight:700;font-size:14px">O que os dados indicam</div>'+insightsRej(R,marcadas).map(x=>'<div class="ins">• '+esc(x)+'</div>').join('')+'<small style="color:#777">Análise automática por contagem. Ela aponta padrões, não causas.</small></div>';
  return html;
}

function salvarTarefa(id){
  const t=S.tarefas.find(x=>x.id===id);if(!t)return;
  const nome=limpar(valEd('e_nome'),60);
  if(!nome)return alert('Digite o nome da tarefa');
  const hr=valEd('e_hora');if(!horaOk(hr))return alert('Escolha um horário válido');
  const tipo=valEd('e_tipo')==='alarme'?'alarme':'checklist';
  const modo=['todos','tarde','manha'].includes(valEd('e_modo'))?valEd('e_modo'):'todos';
  const ic=valEd('e_ic');
  const antes=t.nome;
  t.nome=nome;t.hora=hr;t.tipo=tipo;t.modo=modo;
  if(ICONES_TAREFA.some(x=>x[0]===ic))t.ic=ic;else delete t.ic;
  salvar('tarefas');logar('config','Tarefa editada: '+antes+(antes!==nome?' → '+nome:''));

function salvarSimples(tp,i){
  const nome=limpar(valEd('e_nome'),60);
  if(!nome)return alert('Digite o nome');
  if(tp==='pen'){
    const p=(S.penalidades||[])[i];if(!p)return;const v=numOk(valEd('e_val'),1,1000);
    if(v===null)return alert('Moedas: use um número de 1 a 1000');
    const a=p.nome;p.nome=nome;p.valor=v;salvar('penalidades');logar('config','Penalidade editada: '+a+' → '+nome+' (-'+v+')');
  }else if(tp==='bem'){
    const p=(S.atitudes||[])[i];if(!p)return;const v=numOk(valEd('e_val'),1,1000);
    if(v===null)return alert('Moedas: use um número de 1 a 1000');
    const a=p.nome;p.nome=nome;p.moedas=v;salvar('atitudes');logar('config','Atitude do bem editada: '+a+' → '+nome+' (+'+v+')');
  }else if(tp==='acs'){
    const a=acsPorId(i);if(!a)return;const v=numOk(valEd('e_val'),0,1000);
    if(v===null)return alert('Preço: use um número de 0 a 1000');
    const antes=a.nome;
    editarCatalogo(l=>{const x=l.find(y=>y.id===i);if(x){x.nome=nome;x.custo=v}});
    logar('config','Adereço editado: '+antes+' → '+nome+' ('+v+' moedas)');
  }else if(tp==='cau'){
    const l=causas().map(c=>({nome:c.nome}));if(!l[i])return;
    const a=l[i].nome;l[i].nome=nome;S.causas=l;salvar('causas');logar('config','Causa editada: '+a+' → '+nome);
  }else{
    const p=S.premios[i];if(!p)return;const v=numOk(valEd('e_val'),1,10000);
    if(v===null)return alert('Custo: use um número de 1 a 10000');
    const a=p.nome,ic=valEd('e_ic');p.nome=nome;p.custo=v;
    if(ICONES_PREMIO.some(x=>x[0]===ic))p.ic=ic;else delete p.ic;
    carrinho=carrinho.filter(x=>x!==a);
    if(sonhoNome()===a){S.resgates.sonho=nome;gravar({'resgates.sonho':nome})}
    salvar('premios');logar('config','Prêmio editado: '+a+' → '+nome+' ('+v+' moedas)');
  }
  editando=null;desenhar();
}
function mudarImp(id,k){
  const t=S.tarefas.find(x=>x.id===id);if(!t||!k)return;
  t.imp=k;t.moedas=moedasDe(t);
  salvar('tarefas');logar('config','Importância de "'+t.nome+'": '+nomeImp(k));desenhar();
}
function mudarDia(id,d,marcado){
  const t=S.tarefas.find(x=>x.id===id);if(!t)return;
  let ds=diasDe(t).slice();
  if(marcado&&!ds.includes(d))ds.push(d);
  if(!marcado)ds=ds.filter(x=>x!==d);
  if(!ds.length){alert('Marque pelo menos um dia');desenhar();return}
  t.dias=ds;salvar('tarefas');logar('config','Dias de "'+t.nome+'" alterados');desenhar();
}
function remover(id){
  {
    const t=S.tarefas.find(x=>x.id===id);
    if(!confirm('Excluir a tarefa "'+(t?t.nome:'')+'"? Isso não pode ser desfeito.'))return;
    S.tarefas=S.tarefas.filter(x=>x.id!==id);
    salvar('tarefas');logar('config','Tarefa excluída: '+(t?t.nome:id));desenhar();
  }
}

  const n=limpar(document.getElementById('pen_nome').value,60),v=numOk(document.getElementById('pen_valor').value,1,1000);
  if(!n)return alert('Digite o motivo');
  if(v===null)return alert('Moedas: use um numero de 1 a 1000');
  S.penalidades=S.penalidades||[];S.penalidades.push({nome:n,valor:v});
  salvar('penalidades');logar('config','Nova penalidade: '+n+' (-'+v+')');desenhar();
}

function novaAtitude(){
  const n=limpar(document.getElementById('bem_nome').value,60),v=numOk(document.getElementById('bem_valor').value,1,1000);
  if(!n)return alert('Digite a atitude');
  if(v===null)return alert('Moedas: use um numero de 1 a 1000');
  S.atitudes=S.atitudes||[];S.atitudes.push({id:Date.now(),nome:n,moedas:v});
  salvar('atitudes');logar('config','Nova atitude do bem: '+n+' (+'+v+')');desenhar();
}
function tirarAtitude(i){const a=(S.atitudes||[])[i];if(!a||!confirm('Excluir a atitude do bem "'+a.nome+'"? Isso não pode ser desfeito.'))return;S.atitudes.splice(i,1);salvar('atitudes');logar('config','Atitude do bem excluída: '+(a?a.nome:i));desenhar()}
function novoPremio(){
  const n=limpar(document.getElementById('p_nome').value,60),c=numOk(document.getElementById('p_custo').value,1,10000);
  if(!n)return alert('Digite o nome do premio');
  if(c===null)return alert('Custo: use um numero de 1 a 10000');

  S.premios.push(pn);

}

      const tem=minhasAcs().includes(a.id),c=+a.custo||0,on=v[slot]===a.id;
      const mini=slot==='fundo'&&CENAS[a.id]?'<div class="mini-cena">'+CENAS[a.id]+'</div>':'<span style="font-size:34px">'+esc(a.ic)+'</span>';
      return '<button class="tile '+(on?'on':tem?'':(d>=c?'ok':'sem'))+'" onclick="usarItem(\''+a.id+'\')">'+mini+'<small>'+esc(a.nome)+(on?' ✔':'')+'</small>'+(tem?'':'<b>🪙 '+c+'</b>')+'</button>';
    }).join('')+'</div>';
  };
  html+='<div class="card"><b>✈️ Viagens do bichinho</b><div style="font-size:13px;color:#555;margin-top:4px">Compre uma viagem e o fundo muda para o destino. Depois é só escolher onde ficar.</div>'+grade('fundo',['🏡','Casa'])+'</div>';
  html+='<div class="card"><b>🎨 Cores do bichinho</b><div style="font-size:13px;color:#555;margin-top:4px">Compre uma cor e escolha quando quiser trocar.</div>'+grade('cor',['⚪','Original'])+'</div>';
  html+=cartaoAdotar(true);
  return html;
}

/* admin: configurar o bichinho */
function mudarCfgBicho(c,v){
  const lim={preco:[0,1000],comida:[0,100],exerc:[0,100],limite:[1,20]}[c];if(!lim)return;
  const n=numOk(v,lim[0],lim[1]);
  if(n===null){alert('Use um número de '+lim[0]+' a '+lim[1]);desenhar();return}
  S.cfgBicho=Object.assign({},S.cfgBicho||{});S.cfgBicho[c]=n;
  gravar({['cfgBicho.'+c]:n});
  logar('config','Bichinho: '+({preco:'preço do bichinho',comida:'preço da comida',exerc:'preço do exercício',limite:'limite diário'})[c]+' = '+n);
  desenhar();
}
function editarCatalogo(fn){
  const l=catalogo().map(a=>Object.assign({},a));
  fn(l);S.acessorios=l;gravar({acessorios:l});
}
function novoAcessorio(){
  const nome=limpar(valEd('ac_nome'),30),custo=numOk(valEd('ac_custo'),0,1000);
  const slot=valEd('ac_slot'),ic=valEd('ac_ic');
  if(!nome)return alert('Digite o nome do adereço');
  if(custo===null)return alert('Preço: use um número de 0 a 1000');
  if(!SLOTS_ROUPA.includes(slot)||!ACS_EMOJIS.includes(ic))return alert('Escolha o tipo e o ícone');
  editarCatalogo(l=>l.push({id:'a'+Date.now(),nome:nome,ic:ic,slot:slot,custo:custo}));
  logar('config','Adereço adicionado: '+nome+' ('+custo+' moedas)');desenhar();
}
function ocultarAcessorio(id){
  const a=acsPorId(id);if(!a)return;
  editarCatalogo(l=>{const x=l.find(y=>y.id===id);if(x){if(x.oculto)delete x.oculto;else x.oculto=1}});
  logar('config','Adereço '+(a.oculto?'voltou para a loja: ':'escondido da loja: ')+a.nome);desenhar();
}
function tirarAcessorio(id){
  const a=acsPorId(id);if(!a||!confirm('Excluir o adereço "'+a.nome+'"? Se o João já comprou, ele deixa de aparecer para ele. Isso não pode ser desfeito.'))return;
  editarCatalogo(l=>{const i=l.findIndex(y=>y.id===id);if(i>=0)l.splice(i,1)});
  if(ACS_PADRAO.some(d=>d.id===id)){S.acsApagados=(S.acsApagados||[]).concat([id]);gravar({acsApagados:arrayUnion(id)})}
  logar('config','Adereço excluído: '+a.nome);desenhar();
}

  '<label>Preço do bichinho (moedas)</label><input type="number" value="'+cfg.preco+'" onchange="mudarCfgBicho(\'preco\',this.value)">'+

  catalogo().filter(a=>a.slot===acFiltro).forEach(a=>{
    html+=editando==='ac'+a.id?formSimples('acs',a.id,a.nome,'Preço em moedas',a.custo):'<div class="task"><div class="mini-ico">'+esc(a.ic)+'</div><div class="info"'+(a.oculto?' style="opacity:.55"':'')+'>'+esc(a.nome)+' — '+(+a.custo||0)+' moedas<br><small>'+esc((SLOTS_BICHO.find(x=>x[0]===a.slot)||['',''])[1])+(a.oculto?' · escondido da loja':'')+'</small></div><div class="acoes-i"><button class="ib" title="Editar" aria-label="Editar" onclick="editar(\'ac'+a.id+'\')">✏️</button><button class="ib" title="'+(a.oculto?'Mostrar na loja':'Esconder da loja')+'" aria-label="'+(a.oculto?'Mostrar na loja':'Esconder da loja')+'" onclick="ocultarAcessorio(\''+a.id+'\')">'+(a.oculto?'🙈':'👁️')+'</button><button class="ib red" title="Excluir" aria-label="Excluir" onclick="tirarAcessorio(\''+a.id+'\')">🗑️</button></div></div>';
  });
  html+='<label>Novo adereço</label><input id="ac_nome" placeholder="Ex: Gorro de lã" maxlength="30"><label>Preço em moedas</label><input id="ac_custo" type="number" placeholder="Ex: 10"><label>Tipo</label><select id="ac_slot">'+SLOTS_BICHO.filter(x=>SLOTS_ROUPA.includes(x[0])).map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select><label>Ícone</label><select id="ac_ic">'+ACS_EMOJIS.map(x=>'<option value="'+x+'">'+x+'</option>').join('')+'</select><button onclick="novoAcessorio()">Adicionar adereço</button></div>';
  return html;
}

/* ---------- log ---------- */
const quando=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const LOG_DIAS=30;
const corteLog=()=>Date.now()-LOG_DIAS*864e5;
async function carregarLog(){
  logCarregando=true;desenhar();
  const corte=corteLog(),agora=new Date();
  const meses=[];
  for(let d=new Date(corte);mesDe(d)<=mesDe(agora);d=new Date(d.getFullYear(),d.getMonth()+1,1))meses.push(mesDe(d));
  let itens=[];
  for(const m of meses){
    try{const s=await getDoc(doc(db,'log',m));if(s.exists())itens=itens.concat(s.data().itens||[])}
    catch(e){alert('Nao consegui ler o log: '+e.message)}
  }
  itens=itens.filter(x=>x&&x.t>=corte);
  itens.sort((a,b)=>b.t-a.t);
  logDados=itens.slice(0,400);logCarregando=false;desenhar();
}
async function limparLog(){
  try{if(localStorage.getItem('logLimpo')===hoje())return}catch(e){}
  const corte=corteLog();
  try{
    const sn=await getDocs(collection(db,'log'));
    for(const dc of sn.docs){
      const velhos=((dc.data()||{}).itens||[]).filter(x=>!(x&&x.t>=corte));
      for(let i=0;i<velhos.length;i+=100)
        await updateDoc(doc(db,'log',dc.id),{itens:arrayRemove(...velhos.slice(i,i+100))});
    }
    try{localStorage.setItem('logLimpo',hoje())}catch(e){}
  }catch(e){console.log('limparLog',e.message)}
}
function setLogFiltro(v){logFiltro=v;desenhar()}
function telaLog(){
  const ICO={tarefa:'✅','aprovação':'👍','rejeição':'⛔',bem:'💛',penalidade:'📉','prêmio':'🎁',config:'⚙️',humor:'🙂',acesso:'🔑',semana:'🏆',bichinho:'🐾'};
  let html='<div class="card"><b>Registro de atividades</b><div style="display:flex;gap:8px;align-items:center;margin-top:6px"><select onchange="setLogFiltro(this.value)">'+['todos','João','Edmar','Patricia'].map(x=>'<option value="'+x+'" '+(logFiltro===x?'selected':'')+'>'+(x==='todos'?'Todos':x)+'</option>').join('')+'</select><button onclick="carregarLog()">Atualizar</button></div>';
  if(logCarregando)html+='<div class="task">Carregando...</div>';
  else if(logDados===null)html+='<div class="task">Toque em Atualizar.</div>';
  else{
    const l=logDados.filter(x=>logFiltro==='todos'||x.q===logFiltro).slice(0,150);
    html+=l.length?l.map(x=>'<div class="lg">'+(ICO[x.k]||'•')+' '+esc(x.x)+'<br><small>'+esc(x.q)+' · '+esc(quando(x.t))+'</small></div>').join(''):'<div class="task">Nada registrado ainda.</div>';
  }
  return html+'<small style="color:#777">Guarda os últimos 30 dias. O que for mais antigo é apagado sozinho.</small></div>';
}

/* ---------- tela, login, ligação com o Firebase ---------- */
function ir(a){
  aba=a;editando=null;
  const festa=a==='trofeus'&&!admin()&&S&&temEspecial('iniciante')&&!vistoEsp();
  if(festa)marcarVistoEsp();
  if(a==='log')carregarLog();else desenhar();
  if(festa)setTimeout(()=>{try{efeitoBem();tocar('bem');confete()}catch(e){}},350);
}
function desenhar(){
  const t=document.getElementById('title'),c=document.getElementById('coins'),m=document.getElementById('main'),n=document.getElementById('nav');
  if(!user||!S){
    document.body.classList.remove('kid');
    t.textContent='Rotina';c.textContent='';
    m.innerHTML=!user?telaLogin():'<div class="card">'+esc(erro||'Carregando...')+'</div>';
    n.innerHTML='';return;
  }
  document.body.classList.toggle('kid',!admin());
  t.textContent=admin()?'Administrador':'🚀 Minha rotina';
  c.textContent=(admin()?'':'🪙 ')+S.moedas+' moedas';
  const telas={hoje:telaHoje,progresso:telaMetas,premios:telaPremios,resumo:telaResumo,acoes:telaAcoes,descontos:telaDescontos,trofeus:telaTrofeus,bem:telaBem,bicho:telaBicho,log:telaLog,admin:telaAdmin};
  if(!telas[aba]||((aba==='resumo'||aba==='acoes'||aba==='log'||aba==='admin')&&!admin())||((aba==='bem'||aba==='descontos'||aba==='bicho')&&admin()))aba='hoje';
  try{m.innerHTML=telas[aba]()}catch(e){m.innerHTML='<div class="card late">Erro na tela: '+esc(e.message)+'</div>'}
  let abas;
  if(admin()){
    const pp=pedidosOrdenados().reduce((a,p)=>a+Object.values(p.itens||{}).filter(it=>it.s==='pedido'||it.s==='assumido').length,0);
    const np=pendentesAprov().length+pendentesBem().length;
    abas=[['hoje','Hoje'],['resumo','Resumo'],['progresso','Análise'],['trofeus','Troféus'],['premios','Prêmios'+(pp?' ('+pp+')':'')],['acoes','Ações'+(np?' ('+np+')':'')],['log','Log'],['admin','Config']];
  }else{
    abas=[['hoje','📝 Hoje'],['progresso','📊 Metas'],['trofeus','🏆 Troféus'+(temEspecial('iniciante')&&!vistoEsp()?' 🆕':'')],['premios','🎁 Prêmios'],['bem','💛 Do bem'],['bicho','🐾 Bichinho'],['descontos','📉 Descontos']];
  }
  n.innerHTML=abas.map(a=>'<button class="'+(aba===a[0]?'active':'')+'" onclick="ir(\''+a[0]+'\')">'+a[1]+'</button>').join('')+'<button onclick="sair()">Sair</button>';
}

onAuthStateChanged(auth,async u=>{
  user=u;S=null;antes=null;antesP=null;antesB=null;logouAcesso=false;logDados=null;carrinho=[];
  if(parar){parar();parar=null}
  desenhar();
  if(!u)return;
  try{
    const s=await getDoc(ref);
    if(!s.exists()){
      try{await setDoc(ref,padrao)}
      catch(e){erro='Peça a um administrador para entrar primeiro.';await signOut(auth);return}
    }
    parar=onSnapshot(ref,sn=>{
      if(!sn.exists())return;
      S=sn.data();
      S.historico=S.historico||{};S.premios=S.premios||[];S.tarefas=S.tarefas||[];S.moedas=+S.moedas||0;
      let mig=false;
      S.tarefas.forEach(t=>{if(!t.hora){t.hora=HORAPADRAO[t.id]||'08:00';mig=true}});
      if(mig&&admin())salvar('tarefas');
      checarAvisos(S);
      if(!logouAcesso){logouAcesso=true;logar('acesso',quem()+' entrou no app')}
      if(admin()&&!window.fechando){window.fechando=true;fecharSemanas().finally(()=>{window.fechando=false})}
      if(admin()&&!window.limpandoLog){window.limpandoLog=true;limparLog().finally(()=>{window.limpandoLog=false})}
      if(admin()&&!window.concedendo){window.concedendo=true;concederEspeciais().finally(()=>{window.concedendo=false})}
      if(!digitando())desenhar();
    },e=>{erro=e.message;desenhar()});
  }catch(e){erro='Erro: '+e.message;desenhar()}
});

function digitando(){
  const f=document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='SELECT');
  return (aba==='admin'&&(editando!==null||f))||((aba==='bem'||aba==='premios'||aba==='acoes'||aba==='bicho')&&f)||(aba==='bicho'&&Date.now()<animAte);
}
let diaTela=hoje();
function aoVoltar(){
  if(!S||!user||document.hidden)return;
  const novoDia=hoje()!==diaTela;diaTela=hoje();
  if(!digitando())desenhar();
  if(novoDia&&admin()&&!window.fechando){window.fechando=true;fecharSemanas().finally(()=>{window.fechando=false})}
}
document.addEventListener('visibilitychange',aoVoltar);
window.addEventListener('pageshow',aoVoltar);
window.addEventListener('focus',aoVoltar);
setInterval(()=>{if(S&&aba==='hoje'){if(hoje()!==diaTela)aoVoltar();else desenhar()}},60000);
Object.assign(window,{definirSonho,marcarFolga,tirarFolga,enviarDoacao,novaCausa,tirarCausa,editar,cancelarEd,salvarTarefa,salvarSimples,escolherHumor,mudarCfg,mudarImpCfg,mudarSom,marcar,aprovar,rejeitar,mudarAprovacao,marcarBem,registrarBem,aprovarBem,rejeitarBem,enviarBemLivre,toggleSim,limparSim,enviarPedido,assumir,recusar,entregarItem,aplicarPenalidade,novaPenalidade,tirarPenalidade,mudarNegativo,novaAtitude,tirarAtitude,adicionar,mudarImp,mudarDia,remover,novoPremio,tirarPremio,mudarModo,setPer,moverPer,carregarLog,setLogFiltro,ir,entrar,sair});
