async function salvar(...campos){
  const d={};campos.forEach(c=>{d[c]=S[c]});
  try{await updateDoc(ref,d)}catch(e){alert('Nao consegui salvar: '+e.message)}
}
async function gravar(d){
  try{await updateDoc(ref,d)}catch(e){alert('Nao consegui salvar: '+e.message)}
}
async function transacao(fn){
  try{
    return await runTransaction(db,async tx=>{
      const sn=await tx.get(ref);const d=sn.data()||{};
      const r=fn(d);if(!r)return false;
      tx.update(ref,r);return true;
    });
  }catch(e){alert('Nao consegui salvar: '+e.message);return false}
}
function logar(k,x){
  try{
    setDoc(doc(db,'log',mesDe(new Date())),{itens:arrayUnion({t:Date.now(),q:quem(),k:k,x:limpar(x,200)})},{merge:true}).catch(e=>console.log('log',e.message));
  }catch(e){console.log('log',e.message)}
}

function aviso(msg){
  let e=document.getElementById('toast');
  if(!e){e=document.createElement('div');e.id='toast';
    e.style.cssText='position:fixed;top:12px;left:12px;right:12px;background:#3bb273;color:#fff;padding:14px;border-radius:12px;z-index:200;font-weight:700;display:none';
    document.body.appendChild(e)}
  e.textContent=msg;e.style.display='block';setTimeout(()=>{e.style.display='none'},5000);
}
function checarAvisos(novo){
  const h=(novo.historico||{})[hoje()]||{};
  const snap={};Object.keys(h).forEach(k=>{if(k!==HUMOR_KEY)snap[k]=estado(h[k])});
  const np=Object.keys(novo.pedidos||{}).length;
  const nb=Object.values(novo.bemReg||{}).filter(b=>b.s==='pendente').length;
  if(antes===null){antes=snap;antesP=np;antesB=nb;return}
  if(admin()){
    Object.keys(snap).filter(id=>!antes[id]).forEach(id=>{
      const t=(novo.tarefas||[]).find(x=>String(x.id)===id);
      if(t)aviso((snap[id]==='pendente'?'Aguardando aprovacao: ':'Concluiu: ')+t.nome);
    });
    if(np>antesP)aviso('O João enviou um pedido de prêmios');
    if(nb>antesB)aviso('Atitude do bem aguardando aprovação');
  }
  antes=snap;antesP=np;antesB=nb;
}

const FRASES=[];for(let i=0;i<12;i++){FRASES_T.forEach(t=>FRASES.push(t[i]))}
function fraseDoDia(){
  const d=new Date();
  const n=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,0,1))/86400000);
  return FRASES[((n%FRASES.length)+FRASES.length)%FRASES.length];
}

function humorDe(data){const h=S.historico[data]||{};const v=h[HUMOR_KEY];return typeof v==='number'?v:null}

  h[HUMOR_KEY]=i;
  gravar({['historico.'+hoje()+'.'+HUMOR_KEY]:i});

function cartaoHumor(){
  let linhas='';
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=fmt(d),hm=humorDe(ds);

async function fecharSemanas(){
  if(!admin()||!S)return;
  S.conquistas=S.conquistas||[];
  S.semanasFechadas=S.semanasFechadas||[];
  const atual=segundaDaSemana();
  let mudou=false;const novas=[],fechadas=[];
  for(let k=1;k<=8;k++){
    const seg=new Date(atual);seg.setDate(atual.getDate()-7*k);
    const chave=fmt(seg);
    if(S.semanasFechadas.includes(chave))continue;
    const p=percentualSemana(seg);
    S.semanasFechadas.push(chave);fechadas.push(chave);mudou=true;
    if(p===null)continue;
    const n=nivelDe(p);
    if(!n)continue;
    const c=cfgSemana();
    const bonus={bronze:c.bBronze,prata:c.bPrata,ouro:c.bOuro}[n];
    const usadas=S.conquistas.map(x=>x.fig);
    let livres=FIGS.filter(f=>!usadas.includes(f));
    if(!livres.length)livres=FIGS.slice();
    const fig=livres[Math.floor(Math.random()*livres.length)];
    const conq={semana:chave,pct:p,nivel:n,bonus:bonus,fig:fig};
    S.conquistas.push(conq);
    novas.push(conq);
  }
  if(mudou){
    try{
      const ok=await runTransaction(db,async tx=>{
        const sn=await tx.get(ref);
        const d=sn.data()||{};
        const jaFechadas=d.semanasFechadas||[];
        const fechar=fechadas.filter(x=>!jaFechadas.includes(x));
        if(!fechar.length)return false;
        const conqNovas=novas.filter(x=>fechar.includes(x.semana));
        const bonusReal=conqNovas.reduce((a,x)=>a+x.bonus,0);
        const upd={semanasFechadas:jaFechadas.concat(fechar)};
        if(conqNovas.length)upd.conquistas=(d.conquistas||[]).concat(conqNovas);
        if(bonusReal)upd.moedas=(d.moedas||0)+bonusReal;
        tx.update(ref,upd);
        return conqNovas.length?conqNovas:true;
      });
      if(Array.isArray(ok))logar('semana','Semana fechada: '+ok.map(c=>c.semana+' '+c.nivel+' (+'+c.bonus+')').join(', '));
    }catch(e){alert('Nao consegui fechar a semana: '+e.message)}
  }
}

async function assumir(pid,ik){
  const p=(S.pedidos||{})[pid];const it=p&&p.itens&&p.itens[ik];if(!it)return;
  if(!confirm('Você vai dar "'+it.nome+'" ao João? As '+(+it.custo||0)+' moedas saem do saldo dele agora.'))return;
  let motivo='';
  const ok=await transacao(d=>{
    const x=(((d.pedidos||{})[pid]||{}).itens||{})[ik];
    if(!x||x.s!=='pedido'){motivo='ja';return null}
    const c=+x.custo||0;
    if((d.moedas||0)<c&&!d.saldoNegativo){motivo='saldo';return null}
    const b='pedidos.'+pid+'.itens.'+ik;
    return {[b+'.s']:'assumido',[b+'.por']:quem(),[b+'.dAss']:hoje(),moedas:(d.moedas||0)-c};
  });
  if(ok)logar('prêmio',quem()+' assumiu o prêmio: '+it.nome+' (-'+(+it.custo||0)+' moedas)');
  else if(motivo==='saldo')alert('O João não tem moedas suficientes agora. Recuse o item ou espere.');
  else if(motivo==='ja')aviso('Este prêmio já foi assumido por outro administrador.');
}

function aplicarPenalidade(i){
  const p=(S.penalidades||[])[i];if(!p)return;
  if(!confirm('Descontar '+p.valor+' moedas por: '+p.nome+'?'))return;
  const antesSaldo=S.moedas;
  let novo=S.moedas-p.valor;
  if(!S.saldoNegativo&&novo<0)novo=0;
  const tirou=antesSaldo-novo;
  S.moedas=novo;
  S.descontos=S.descontos||[];
  const desc={id:Date.now(),motivo:p.nome,valor:tirou,data:hoje(),p:quem()};
  S.descontos.push(desc);
  gravar({moedas:increment(-tirou),descontos:arrayUnion(desc)});
  logar('penalidade',quem()+' descontou '+tirou+' moedas: '+p.nome);
  desenhar();
}

/* ---------- análise (aba Metas) ---------- */
const br=ds=>String(ds||'').slice(8)+'/'+String(ds||'').slice(5,7);
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const addDias=(d,n)=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()+n);return x};
const segundaDeData=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
function datasEntre(a,b){
  const l=[];const d=new Date(a+'T12:00:00');const f=new Date(b+'T12:00:00');let n=0;
  while(d<=f&&n<4000){l.push(fmt(d));d.setDate(d.getDate()+1);n++}
  return l;
}
function inicioDados(){
  let m=hoje();
  Object.keys(S.historico||{}).forEach(k=>{if(k<m)m=k});
  S.tarefas.forEach(t=>{if(t.id>1e12){const k=fmt(new Date(t.id));if(k<m)m=k}});
  return m;
}
const criadaApos=(t,ds)=>t.id>1e12&&fmt(new Date(t.id))>ds;
function mapas(){
  const col={},gas={},per={};
  const add=(m,k,v)=>{if(k)m[k]=(m[k]||0)+v};
  Object.keys(S.historico||{}).forEach(ds=>{
    const h=S.historico[ds];
    Object.keys(h).forEach(id=>{
      if(id===HUMOR_KEY)return;
      const e=estado(h[id]);
      if(e==='aprovada'||e==='feita'){
        const t=S.tarefas.find(x=>String(x.id)===id);
        const v=(h[id]&&typeof h[id]==='object'&&h[id].v!=null)?(+h[id].v||0):(t?moedasDe(t):0);
        add(col,ds,v);
      }
    });
  });
  Object.values(S.bemReg||{}).forEach(b=>{if(b.s==='aprovada')add(col,b.data,+b.moedas||0)});
  (S.conquistas||[]).forEach(c=>{add(col,fmt(addDias(new Date(c.semana+'T12:00:00'),6)),+c.bonus||0)});
  Object.values(S.pedidos||{}).forEach(p=>Object.values(p.itens||{}).forEach(it=>{if(it.s==='assumido'||it.s==='entregue')add(gas,it.dAss||p.data,+it.custo||0)}));
  (S.descontos||[]).forEach(d=>add(per,d.data,+d.valor||0));
  return {col:col,gas:gas,per:per};
}
function agrega(ini,fim,M,filtro){
  const r={esp:0,feito:0,rej:0,pend:0,col:0,gas:0,per:0,porT:{}};
  const hj=hoje();
  datasEntre(ini,fim).forEach(ds=>{
    if(ds>hj)return;
    const d=new Date(ds+'T12:00:00');const h=(S.historico||{})[ds]||{};
    doModo().forEach(t=>{
      if(filtro&&!filtro(t))return;
      if(!valeNoDia(t,d)||criadaApos(t,ds))return;
      const e=estado(h[t.id]);
      const o=r.porT[t.id]=r.porT[t.id]||{esp:0,feito:0,rej:0,pend:0};
      r.esp++;o.esp++;
      if(e==='feita'||e==='aprovada'){r.feito++;o.feito++}
      else if(e==='rejeitada'){r.rej++;o.rej++}
      else if(e==='pendente'){r.pend++;o.pend++}
    });
    r.col+=M.col[ds]||0;r.gas+=M.gas[ds]||0;r.per+=M.per[ds]||0;
  });
  return r;
}
function baldes(){
  const hj=hoje();
  const r=new Date(ui.ref);r.setHours(12,0,0,0);
  const per=ui.per;
  if(per==='dia'){
    const s=fmt(r);
    return {titulo:(s===hj?'Hoje, ':'')+br(s)+'/'+s.slice(0,4),ini:s,fim:s,itens:[['manha','Manhã'],['tarde','Tarde'],['noite','Noite']].map(x=>({l:x[1],ini:s,fim:s,f:t=>periodo(t)===x[0]}))};
  }
  if(per==='semana'){
    const seg=segundaDeData(r);const itens=[];
    for(let i=0;i<7;i++){const d=addDias(seg,i),s=fmt(d);itens.push({l:NOMEDIA[d.getDay()]+' '+s.slice(8),ini:s,fim:s})}
    return {titulo:'Semana de '+br(itens[0].ini)+' a '+br(itens[6].ini),ini:itens[0].ini,fim:itens[6].fim,itens:itens};
  }
  if(per==='mes'){
    const y=r.getFullYear(),m=r.getMonth(),ult=new Date(y,m+1,0).getDate();const itens=[];
    for(let i=1;i<=ult;i++){const s=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');itens.push({l:String(i),ini:s,fim:s})}
    return {titulo:MESES[m]+' de '+y,ini:itens[0].ini,fim:itens[ult-1].fim,itens:itens};
  }
  if(per==='ano'){
    const y=r.getFullYear(),itens=[];
    for(let m=0;m<12;m++){const ult=new Date(y,m+1,0).getDate(),mm=String(m+1).padStart(2,'0');itens.push({l:MESES[m].slice(0,3),ini:y+'-'+mm+'-01',fim:y+'-'+mm+'-'+String(ult).padStart(2,'0')})}
    return {titulo:String(y),ini:itens[0].ini,fim:itens[11].fim,itens:itens};
  }
  const ini=inicioDados(),itens=[];
  const d0=new Date(ini+'T12:00:00');
  const dias=Math.round((new Date(hj+'T12:00:00')-d0)/86400000);
  if(dias<=140){
    let seg=segundaDeData(d0);
    while(fmt(seg)<=hj){itens.push({l:br(fmt(seg)),ini:fmt(seg),fim:fmt(addDias(seg,6))});seg=addDias(seg,7)}
  }else{
    let y=d0.getFullYear(),m=d0.getMonth();const n=new Date();
    while(y*12+m<=n.getFullYear()*12+n.getMonth()){
      const ult=new Date(y,m+1,0).getDate(),mm=String(m+1).padStart(2,'0');
      itens.push({l:MESES[m].slice(0,3)+'/'+String(y).slice(2),ini:y+'-'+mm+'-01',fim:y+'-'+mm+'-'+String(ult).padStart(2,'0')});
      m++;if(m>11){m=0;y++}
    }
  }
  return {titulo:'Desde '+br(ini)+'/'+ini.slice(0,4),ini:itens[0].ini,fim:itens[itens.length-1].fim,itens:itens};
}
function setPer(p){ui.per=p;ui.ref=new Date();desenhar()}
function moverPer(n){
  const r=new Date(ui.ref);r.setHours(12,0,0,0);
  if(ui.per==='dia')r.setDate(r.getDate()+n);
  else if(ui.per==='semana')r.setDate(r.getDate()+7*n);
  else if(ui.per==='mes')r.setMonth(r.getMonth()+n,1);
  else if(ui.per==='ano')r.setFullYear(r.getFullYear()+n,0,1);
  const hj=new Date();hj.setHours(12,0,0,0);
  ui.ref=r>hj?hj:r;
  desenhar();

function graf(labels,series,o){
  const W=320,H=170,pl=30,pr=6,pt=12,pb=24;
  const n=labels.length;
  if(!n)return '<div style="color:#777">Sem dados</div>';
  const mx=o.max!=null?o.max:Math.max(1,...series.flatMap(s=>s.v.map(x=>+x||0)));
  const iw=W-pl-pr,ih=H-pt-pb;
  const sy=v=>pt+ih-(Math.min(+v||0,mx)/mx)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  [0,0.5,1].forEach(f=>{const y=pt+ih-f*ih;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#e3e7ee"/><text x="'+(pl-4)+'" y="'+(y+3)+'" font-size="9" text-anchor="end" fill="#777">'+Math.round(mx*f)+'</text>'});
  const bw=iw/n;
  if(o.tipo==='linha'){
    series.forEach(se=>{
      const pts=se.v.map((v,i)=>(pl+bw*i+bw/2)+','+sy(v)).join(' ');
      s+='<polyline fill="none" stroke="'+se.cor+'" stroke-width="2.5" points="'+pts+'"/>';
      if(n<=40)se.v.forEach((v,i)=>{s+='<circle cx="'+(pl+bw*i+bw/2)+'" cy="'+sy(v)+'" r="2.5" fill="'+se.cor+'"/>'});
    });
  }else{
    const k=series.length,gw=bw*0.8,sw=gw/k;
    series.forEach((se,j)=>se.v.forEach((v,i)=>{
      const x=pl+bw*i+(bw-gw)/2+sw*j,y=sy(v);
      s+='<rect x="'+x+'" y="'+y+'" width="'+Math.max(1,sw-1)+'" height="'+Math.max(0,pt+ih-y)+'" rx="2" fill="'+se.cor+'"/>';
      if(n<=12&&(+v||0)>0)s+='<text x="'+(x+sw/2)+'" y="'+(y-2)+'" font-size="8" text-anchor="middle" fill="#444">'+(o.fmt?o.fmt(v):v)+'</text>';
    }));
  }
  const passo=Math.ceil(n/8);
  labels.forEach((l,i)=>{if(i%passo===0)s+='<text x="'+(pl+bw*i+bw/2)+'" y="'+(H-8)+'" font-size="9" text-anchor="middle" fill="#555">'+esc(l)+'</text>'});
  s+='</svg>';
  s+='<div style="font-size:12px;margin-top:4px">'+series.map(se=>'<span style="display:inline-block;width:10px;height:10px;background:'+se.cor+';border-radius:2px;margin-right:4px"></span>'+esc(se.nome)).join(' &nbsp; ')+'</div>';
  return s;
}
function hbar(items,cor,max){
  if(!items.length)return '';
  const mx=max!=null?max:Math.max(1,...items.map(i=>i.v));
  return items.map(i=>'<div class="hb"><div class="t"><span>'+esc(i.l)+'</span><span>'+esc(i.sub!=null?i.sub:i.v)+'</span></div><div class="b"><div style="width:'+Math.max(2,Math.min(100,Math.round(i.v/mx*100)))+'%;background:'+(i.cor||cor)+'"></div></div></div>').join('');
}
const STOP=new Set(['de','da','do','das','dos','as','os','em','na','no','nas','nos','uma','que','nao','foi','ser','para','por','com','mas','ainda','muito','mais','porque','isso','isto','esta','estava','tava','voce','mesmo','tem','ter','fez','fazer','feita','feito','tarefa','ele','ela','sua','seu','meu','minha','como','quando','pois','nem','aos','pela','pelo','esse','essa','sem','era','sao','estou','esta']);
function analiseRej(ini,fim){
  const rej=[];
  datasEntre(ini,fim).forEach(ds=>{
    if(ds>hoje())return;
    const h=(S.historico||{})[ds]||{};
    Object.keys(h).forEach(id=>{
      if(id===HUMOR_KEY)return;
      const r=h[id];
      if(estado(r)==='rejeitada'){
        const t=S.tarefas.find(x=>String(x.id)===id);
        rej.push({ds:ds,id:id,t:t,m:(r&&typeof r==='object'&&r.m)?r.m:''});
      }
    });
  });
  const porT={};
  rej.forEach(x=>{const k=x.t?x.t.nome:'(tarefa removida)';porT[k]=(porT[k]||0)+1});
  const top=Object.keys(porT).map(k=>({l:k,v:porT[k],sub:porT[k]+'×'})).sort((a,b)=>b.v-a.v).slice(0,5);
  const mot={};
  rej.forEach(x=>{if(!x.m)return;const k=semAcento(x.m);mot[k]=mot[k]||{n:0,txt:x.m};mot[k].n++});
  const motivos=Object.values(mot).sort((a,b)=>b.n-a.n).slice(0,5);
  const pal={};
  rej.forEach(x=>{if(!x.m)return;semAcento(x.m).split(/[^a-z0-9]+/).forEach(w=>{if(w.length>=4&&!STOP.has(w))pal[w]=(pal[w]||0)+1})});
  const palavras=Object.keys(pal).map(w=>({w:w,n:pal[w]})).sort((a,b)=>b.n-a.n).slice(0,6);
  const per={manha:0,tarde:0,noite:0};
  rej.forEach(x=>{if(x.t)per[periodo(x.t)]++});
  const sem={};
  rej.forEach(x=>{const d=new Date(x.ds+'T12:00:00').getDay();sem[d]=(sem[d]||0)+1});
  return {total:rej.length,top:top,motivos:motivos,palavras:palavras,per:per,sem:sem,semMotivo:rej.filter(x=>!x.m).length};
}
function insightsRej(R,marcadas){
  const ins=[];
  if(!R.total){ins.push('Nenhuma tarefa rejeitada neste período.');return ins}
  const pct=marcadas?Math.round(R.total/marcadas*100):0;
  ins.push(R.total+' rejeição(ões) neste período'+(marcadas?', cerca de '+pct+'% das tarefas marcadas.':'.'));
  if(R.top[0])ins.push('A tarefa mais rejeitada foi "'+R.top[0].l+'" ('+R.top[0].v+'×).');
  if(R.motivos[0]&&R.motivos[0].n>=2)ins.push('O motivo que mais se repete: "'+R.motivos[0].txt+'" ('+R.motivos[0].n+'×).');
  const pk=Object.keys(R.per).sort((a,b)=>R.per[b]-R.per[a])[0];
  if(R.per[pk]>0)ins.push('A maioria das rejeições acontece em tarefas da '+NOMEP[pk].toLowerCase()+' ('+R.per[pk]+' de '+R.total+').');
  const dk=Object.keys(R.sem).sort((a,b)=>R.sem[b]-R.sem[a])[0];
  if(dk!==undefined&&R.total>=3)ins.push('O dia da semana com mais rejeições é '+NOMEDIA[dk]+' ('+R.sem[dk]+').');
  if(R.palavras.length)ins.push('Palavras mais citadas nos motivos: '+R.palavras.map(p=>p.w+' ('+p.n+')').join(', ')+'.');
  if(R.semMotivo)ins.push(R.semMotivo+' rejeição(ões) sem motivo registrado. Anote sempre o motivo para esta análise melhorar.');
  return ins;
}

  const t=S.tarefas.find(x=>x.id===id);if(!t||!k)return;
  t.imp=k;t.moedas=moedasDe(t);
  salvar('tarefas');logar('config','Importância de "'+t.nome+'": '+nomeImp(k));desenhar();
}
function mudarDia(id,d,marcado){
  const t=S.tarefas.find(x=>x.id===id);if(!t)return;
  let ds=diasDe(t).slice();
  if(marcado&&!ds.includes(d))ds.push(d);
  if(!marcado)ds=ds.filter(x=>x!==d);
  if(!ds.length){alert('Marque pelo menos um dia');desenhar();return}
  t.dias=ds;salvar('tarefas');logar('config','Dias de "'+t.nome+'" alterados');desenhar();
}
function remover(id){
  if(confirm('Excluir esta tarefa?')){
    const t=S.tarefas.find(x=>x.id===id);
    S.tarefas=S.tarefas.filter(x=>x.id!==id);
    salvar('tarefas');logar('config','Tarefa excluída: '+(t?t.nome:id));desenhar();
  }
}
function novaPenalidade(){
  const n=limpar(document.getElementById('pen_nome').value,60),v=numOk(document.getElementById('pen_valor').value,1,1000);
  if(!n)return alert('Digite o motivo');
  if(v===null)return alert('Moedas: use um numero de 1 a 1000');
  S.penalidades=S.penalidades||[];S.penalidades.push({nome:n,valor:v});
  salvar('penalidades');logar('config','Nova penalidade: '+n+' (-'+v+')');desenhar();
}
function tirarPenalidade(i){const p=(S.penalidades||[])[i];S.penalidades.splice(i,1);salvar('penalidades');logar('config','Penalidade excluída: '+(p?p.nome:i));desenhar()}
function mudarNegativo(v){S.saldoNegativo=v;salvar('saldoNegativo');logar('config','Saldo negativo '+(v?'permitido':'bloqueado'));desenhar()}
function novaAtitude(){
  const n=limpar(document.getElementById('bem_nome').value,60),v=numOk(document.getElementById('bem_valor').value,1,1000);
  if(!n)return alert('Digite a atitude');
  if(v===null)return alert('Moedas: use um numero de 1 a 1000');
  S.atitudes=S.atitudes||[];S.atitudes.push({id:Date.now(),nome:n,moedas:v});
  salvar('atitudes');logar('config','Nova atitude do bem: '+n+' (+'+v+')');desenhar();
}
function tirarAtitude(i){const a=(S.atitudes||[])[i];S.atitudes.splice(i,1);salvar('atitudes');logar('config','Atitude do bem excluída: '+(a?a.nome:i));desenhar()}
function novoPremio(){
  const n=limpar(document.getElementById('p_nome').value,60),c=numOk(document.getElementById('p_custo').value,1,10000);
  if(!n)return alert('Digite o nome do premio');
  if(c===null)return alert('Custo: use um numero de 1 a 10000');
  S.premios.push({nome:n,custo:c});
  salvar('premios');logar('config','Novo prêmio: '+n+' ('+c+' moedas)');desenhar();
}
function tirarPremio(i){const p=S.premios[i];S.premios.splice(i,1);salvar('premios');logar('config','Prêmio excluído: '+(p?p.nome:i));desenhar()}

/* ---------- log ---------- */
const quando=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
async function carregarLog(){
  logCarregando=true;desenhar();
  const d=new Date();
  const m1=mesDe(d),m2=mesDe(new Date(d.getFullYear(),d.getMonth()-1,15));
  let itens=[];
  for(const m of [m1,m2]){
    try{const s=await getDoc(doc(db,'log',m));if(s.exists())itens=itens.concat(s.data().itens||[])}
    catch(e){alert('Nao consegui ler o log: '+e.message)}
  }
  itens.sort((a,b)=>b.t-a.t);
  logDados=itens.slice(0,400);logCarregando=false;desenhar();
}
function setLogFiltro(v){logFiltro=v;desenhar()}
function telaLog(){
  const ICO={tarefa:'✅','aprovação':'👍','rejeição':'⛔',bem:'💛',penalidade:'📉','prêmio':'🎁',config:'⚙️',humor:'🙂',acesso:'🔑',semana:'🏆'};
  let html='<div class="card"><b>Registro de atividades</b><div style="display:flex;gap:8px;align-items:center;margin-top:6px"><select onchange="setLogFiltro(this.value)">'+['todos','João','Edmar','Patricia'].map(x=>'<option value="'+x+'" '+(logFiltro===x?'selected':'')+'>'+(x==='todos'?'Todos':x)+'</option>').join('')+'</select><button onclick="carregarLog()">Atualizar</button></div>';
  if(logCarregando)html+='<div class="task">Carregando...</div>';
  else if(logDados===null)html+='<div class="task">Toque em Atualizar.</div>';
  else{
    const l=logDados.filter(x=>logFiltro==='todos'||x.q===logFiltro).slice(0,150);
    html+=l.length?l.map(x=>'<div class="lg">'+(ICO[x.k]||'•')+' '+esc(x.x)+'<br><small>'+esc(x.q)+' · '+esc(quando(x.t))+'</small></div>').join(''):'<div class="task">Nada registrado ainda.</div>';
  }
  return html+'<small style="color:#777">Mostra este mês e o anterior.</small></div>';
}

/* ---------- tela, login, ligação com o Firebase ---------- */
function ir(a){aba=a;if(a==='log')carregarLog();else desenhar()}
function desenhar(){
  const t=document.getElementById('title'),c=document.getElementById('coins'),m=document.getElementById('main'),n=document.getElementById('nav');
  if(!user||!S){
    document.body.classList.remove('kid');
    t.textContent='Rotina';c.textContent='';
    m.innerHTML=!user?telaLogin():'<div class="card">'+esc(erro||'Carregando...')+'</div>';
    n.innerHTML='';return;
  }
  document.body.classList.toggle('kid',!admin());
  t.textContent=admin()?'Administrador':'🚀 Minha rotina';
  c.textContent=(admin()?'':'🪙 ')+S.moedas+' moedas';
  const telas={hoje:telaHoje,progresso:telaMetas,premios:telaPremios,resumo:telaResumo,aprovar:telaAprovar,descontos:telaDescontos,trofeus:telaTrofeus,bem:telaBem,log:telaLog,admin:telaAdmin};
  if(!telas[aba]||((aba==='resumo'||aba==='aprovar'||aba==='log'||aba==='admin')&&!admin())||((aba==='bem'||aba==='descontos')&&admin()))aba='hoje';
  try{m.innerHTML=telas[aba]()}catch(e){m.innerHTML='<div class="card late">Erro na tela: '+esc(e.message)+'</div>'}
  let abas;
  if(admin()){
    const pp=pedidosOrdenados().reduce((a,p)=>a+Object.values(p.itens||{}).filter(it=>it.s==='pedido'||it.s==='assumido').length,0);
    const np=pendentesAprov().length+pendentesBem().length;
    abas=[['hoje','Hoje'],['progresso','Metas'],['trofeus','Troféus'],['premios','Prêmios'+(pp?' ('+pp+')':'')],['resumo','Resumo'],['aprovar','Aprovar'+(np?' ('+np+')':'')],['log','Log'],['admin','Config']];
  }else{
    abas=[['hoje','📝 Hoje'],['progresso','📊 Metas'],['trofeus','🏆 Troféus'],['premios','🎁 Prêmios'],['bem','💛 Do bem'],['descontos','📉 Descontos']];
  }
  n.innerHTML=abas.map(a=>'<button class="'+(aba===a[0]?'active':'')+'" onclick="ir(\''+a[0]+'\')">'+a[1]+'</button>').join('')+'<button onclick="sair()">Sair</button>';
}

onAuthStateChanged(auth,async u=>{
  user=u;S=null;antes=null;antesP=null;antesB=null;logouAcesso=false;logDados=null;carrinho=[];
  if(parar){parar();parar=null}
  desenhar();
  if(!u)return;
  try{
    const s=await getDoc(ref);
    if(!s.exists()){
      try{await setDoc(ref,padrao)}
      catch(e){erro='Peça a um administrador para entrar primeiro.';await signOut(auth);return}
    }
    parar=onSnapshot(ref,sn=>{
      if(!sn.exists())return;
      S=sn.data();
      S.historico=S.historico||{};S.premios=S.premios||[];S.tarefas=S.tarefas||[];S.moedas=+S.moedas||0;
      let mig=false;
      S.tarefas.forEach(t=>{if(!t.hora){t.hora=HORAPADRAO[t.id]||'08:00';mig=true}});
      if(mig&&admin())salvar('tarefas');
      checarAvisos(S);
      if(!logouAcesso){logouAcesso=true;logar('acesso',quem()+' entrou no app')}
      if(admin()&&!window.fechando){window.fechando=true;fecharSemanas().finally(()=>{window.fechando=false})}
      const digitando=aba==='admin'&&document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='SELECT');
      if(!digitando)desenhar();
    },e=>{erro=e.message;desenhar()});
  }catch(e){erro='Erro: '+e.message;desenhar()}
});

setInterval(()=>{if(S&&aba==='hoje')desenhar()},60000);
Object.assign(window,{escolherHumor,mudarCfg,mudarImpCfg,mudarSom,marcar,aprovar,rejeitar,mudarAprovacao,marcarBem,registrarBem,aprovarBem,rejeitarBem,toggleSim,limparSim,enviarPedido,assumir,recusar,entregarItem,aplicarPenalidade,novaPenalidade,tirarPenalidade,mudarNegativo,novaAtitude,tirarAtitude,adicionar,mudarImp,mudarDia,remover,novoPremio,tirarPremio,mudarModo,setPer,moverPer,carregarLog,setLogFiltro,ir,entrar,sair});
</script>
